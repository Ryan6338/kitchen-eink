alias: Show Kitchen Recipe Overview
description: Return the kitchen display to the loaded recipe's overview page.
sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.kitchen_recipe_page
    data:
      option: overview

  - variables:
      result:
        success: true
        page: overview

  - stop: Kitchen recipe overview displayed
    response_variable: result
