# Add this block to Home Assistant's configuration.yaml (or include it as a
# package). It exposes the daily forecast as scalar attributes that ESPHome can
# subscribe to. The AccuWeather integration is exposed as weather.redcliffe. Change it here and
# your weather entity has a different ID.

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: weather.redcliffe
      - trigger: time_pattern
        hours: /1
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.redcliffe
        data:
          type: daily
        response_variable: daily
    sensor:
      - name: Kitchen Weather Forecast
        unique_id: kitchen_weather_forecast
        state: "{{ now().isoformat() }}"
        attributes:
          wind_unit: "{{ state_attr('weather.redcliffe', 'wind_speed_unit') or '' }}"
          precipitation_unit: "{{ state_attr('weather.redcliffe', 'precipitation_unit') or '' }}"
          day_0_name: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ as_local(as_datetime(f[0].datetime)).strftime('%a') if f | count > 0 else '--' }}
          day_0_condition: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ f[0].condition if f | count > 0 else 'unknown' }}
          day_0_high: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ f[0].temperature if f | count > 0 else none }}
          day_0_low: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ f[0].templow if f | count > 0 else none }}
          day_0_rain: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ f[0].precipitation_probability | default(none) if f | count > 0 else none }}
          day_0_precipitation: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ f[0].precipitation | default(none) if f | count > 0 else none }}
          day_0_humidity: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ f[0].humidity | default(none) if f | count > 0 else none }}
          day_0_wind: >-
            {% set f = daily['weather.redcliffe'].forecast %}
            {{ f[0].wind_speed | default(none) if f | count > 0 else none }}

