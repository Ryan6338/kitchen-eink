# Add this block to Home Assistant's configuration.yaml (or include it as a
# package). It exposes the daily forecast as scalar attributes that ESPHome can
# subscribe to. Change weather.forecast_home here and in kitchen-common.yaml if
# your weather entity has a different ID.

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: /1
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: daily
    sensor:
      - name: Kitchen Weather Forecast
        unique_id: kitchen_weather_forecast
        state: "{{ now().isoformat() }}"
        attributes:
          day_0_name: >-
            {% set f = daily['weather.forecast_home'].forecast %}
            {{ as_local(as_datetime(f[0].datetime)).strftime('%a') if f | count > 0 else '--' }}
          day_0_condition: >-
            {% set f = daily['weather.forecast_home'].forecast %}
            {{ f[0].condition if f | count > 0 else 'unknown' }}
          day_0_high: >-
            {% set f = daily['weather.forecast_home'].forecast %}
            {{ f[0].temperature if f | count > 0 else none }}
          day_0_low: >-
            {% set f = daily['weather.forecast_home'].forecast %}
            {{ f[0].templow if f | count > 0 else none }}
          day_0_rain: >-
            {% set f = daily['weather.forecast_home'].forecast %}
            {{ f[0].precipitation_probability | default(0) if f | count > 0 else none }}

          day_1_name: >-
            {% set f = daily['weather.forecast_home'].forecast %}
            {{ as_local(as_datetime(f[1].datetime)).strftime('%a') if f | count > 1 else '--' }}
