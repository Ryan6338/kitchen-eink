# ===================================================================
# KITCHEN RECIPE DISPLAY
# Shared by the 1024x600 Waveshare ESP32-S3 display and PC simulator.
# ===================================================================

# -------------------------------------------------------------------
# DEFAULT SUBSTITUTIONS
# -------------------------------------------------------------------

lvgl: !include kitchen-lvgl.yaml

#
# Hardware configs can override these.
#
# Simulator:
#   display_refresh_delay: 50ms
#
# ESP32-S3 LCD:
#
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# INITIAL DISPLAY REFRESH
# -------------------------------------------------------------------

esphome:
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: lcd_backlight
          brightness: 100%
      - script.execute: refresh_display


# -------------------------------------------------------------------
# FULL-SCREEN BACKGROUND
# -------------------------------------------------------------------

image:
  - platform: file
    file: assets/day-clock.png
    id: day_clock_background
    type: RGB565
  - platform: file
    file: assets/night-clock.png
    id: night_clock_background
    type: RGB565


# -------------------------------------------------------------------
# FONTS
# -------------------------------------------------------------------
#
# 4 BPP provides smooth anti-aliased text on the RGB LCD.
#
# -------------------------------------------------------------------

font:
  - file: "assets/laries.otf"
    id: font_clock
    size: 205
    bpp: 4
    glyphs: "0123456789:- "

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_ingredient_category
    size: 18
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_body
    size: 20
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_body_compact
    size: 16
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_body_small
    size: 13
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_meta
    size: 15
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_time_label
    size: 13
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_time_value
    size: 18
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_heading
    size: 25
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_title
    size: 32
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_meal_planner_title
    size: 42
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_meal_question
    size: 180
    bpp: 4
    glyphs: "?"

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_button
    size: 17
    bpp: 4


# -------------------------------------------------------------------
# LOCAL UI STATE
# -------------------------------------------------------------------

globals:
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'

  - id: ingredient_checks
    type: uint64_t
    restore_value: no
    initial_value: '0'

# current_page:
#
#   0 = Recipe overview
#   1 = Cooking instructions
#   2 = Ingredients


# -------------------------------------------------------------------
# HOME ASSISTANT RECIPE DATA
# -------------------------------------------------------------------
#
# These entities do not have to exist for the simulator to compile.
# Until they exist, the display will show fallback/sample content.
#
# Create these later in Home Assistant:
#
# input_text.kitchen_recipe_title
# input_text.kitchen_recipe_instruction
# input_text.kitchen_recipe_ingredients
# input_text.kitchen_recipe_servings
#
# input_number.kitchen_recipe_step
# input_number.kitchen_recipe_step_count
#
# We'll eventually replace some of these with data from Mealie.
#
# -------------------------------------------------------------------

text_sensor:

  - platform: homeassistant
    id: weather_condition
    entity_id: weather.redcliffe

    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return !id(recipe_active).state;
            then:
              - script.execute: refresh_display

  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun

    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return !id(recipe_active).state;
            then:
              - script.execute: refresh_display

  - platform: homeassistant
    id: kitchen_display_page
    entity_id: input_select.kitchen_display_page

    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "clock";'
            then:
              - lvgl.page.show: clock_page
        - if:
            condition:
              lambda: 'return x == "meal_planner";'
            then:
              - lvgl.page.show: meal_planner_page
