# -------------------------------------------------------------------
# DISPLAY REFRESH
# -------------------------------------------------------------------
#
# Update LVGL labels and select the active page after a short delay.
# The simulator can delay updates; hardware can use 0s.
#
# mode: restart is intentional.
#
# If HA sends title, step, instruction, servings etc. one after
# another, the timer restarts and we only render one LCD frame
# once all the new data has arrived.
#
# -------------------------------------------------------------------

script:

  - id: refresh_display
    mode: restart
    then: !include kitchen-lvgl-refresh.yaml

  # Home Assistant sends the forecast attributes as a group. Give all of the
  # imported values a moment to settle before drawing a single new frame.
  - id: refresh_weather_display
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            lambda: |-
              return !id(recipe_active).state;
          then:
            - script.execute: refresh_display


  - id: show_ingredients
    then:
      - lambda: |-
          id(current_page) = 2;
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.kitchen_recipe_page
            option: ingredients
      - script.execute: refresh_display


  - id: show_overview
    then:
      - lambda: |-
          id(current_page) = 0;
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.kitchen_recipe_page
            option: overview
      - script.execute: refresh_display


  - id: show_instructions
    then:
      - lambda: |-
          id(current_page) = 1;
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.kitchen_recipe_page
            option: instructions
      - script.execute: refresh_display


# -------------------------------------------------------------------
# TOUCH BUTTONS
# -------------------------------------------------------------------
#
# Screen dimensions:
#
#     1024 x 600 (landscape)
#
# Bottom navigation starts at:
#
#     Y = 538
#
# ---------------------------------------------------------------
# |       Previous      |   Ingredients   |        Next         |
# |      0 - 327        |    328 - 695    |     696 - 1023       |
# ---------------------------------------------------------------
#
# -------------------------------------------------------------------

binary_sensor:

  - platform: homeassistant
    id: recipe_active
    entity_id: input_boolean.kitchen_recipe_active

    on_press:
      then:
        - lambda: |-
            id(current_page) = 0;
            id(ingredient_checks) = 0;

        - lvgl.widget.update:
            id:
              - ingredient_0
              - ingredient_1
              - ingredient_2
              - ingredient_3
              - ingredient_4
              - ingredient_5
              - ingredient_6
              - ingredient_7
              - ingredient_8
              - ingredient_9
              - ingredient_10
              - ingredient_11
              - ingredient_12
              - ingredient_13
              - ingredient_14
              - ingredient_15
              - ingredient_16
              - ingredient_17
              - ingredient_18
              - ingredient_19
              - ingredient_20
              - ingredient_21
              - ingredient_22
              - ingredient_23
              - ingredient_24
              - ingredient_25
              - ingredient_26
              - ingredient_27
              - ingredient_28
              - ingredient_29
              - ingredient_30
              - ingredient_31
              - ingredient_32
              - ingredient_33
              - ingredient_34
              - ingredient_35
              - ingredient_36
              - ingredient_37
              - ingredient_38
              - ingredient_39
              - ingredient_40
              - ingredient_41
              - ingredient_42
              - ingredient_43
              - ingredient_44
              - ingredient_45
              - ingredient_46
              - ingredient_47
              - ingredient_48
              - ingredient_49
            state:
              checked: false

        - script.execute: refresh_display

    on_release:
      then:
        - lambda: |-
            id(current_page) = 0;
            id(ingredient_checks) = 0;
        - script.execute: refresh_display
#   display_refresh_delay: 50ms

  - platform: touchscreen
    id: touch_previous
    touchscreen_id: main_touchscreen

    x_min: 0
    x_max: 327
    y_min: 538
    y_max: 599

    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(current_page) == 1;
            then:
              - if:
                  condition:
                    lambda: |-
                      return id(recipe_step).has_state() && id(recipe_step).state > 1;
                  then:
                    - homeassistant.action:
                        action: input_number.decrement
                        data:
                          entity_id: input_number.kitchen_recipe_step
                  else:
                    - script.execute: show_overview


  - platform: touchscreen
    id: touch_middle
    touchscreen_id: main_touchscreen

    x_min: 328
    x_max: 695
    y_min: 538
    y_max: 599

    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(current_page) == 0;
            then:
              - script.execute: show_ingredients
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(current_page) == 1;
                  then:
                    - script.execute: show_ingredients
                  else:
                    - script.execute: show_instructions


  - platform: touchscreen
    id: touch_next
    touchscreen_id: main_touchscreen

    x_min: 696
    x_max: 1023
    y_min: 538
    y_max: 599

    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(current_page) == 1;

            then:
              - if:
                  condition:
                    lambda: |-
                      int step = id(recipe_step).has_state()
                        ? (int) id(recipe_step).state
                        : 1;

                      int count = id(recipe_step_count).has_state()
                        ? (int) id(recipe_step_count).state
                        : 1;

                      if (count < 1)
                        count = 1;

                      return step < count;

                  then:
                    - homeassistant.action:
                        action: input_number.increment
                        data:
                          entity_id: input_number.kitchen_recipe_step

                  else:
                    - homeassistant.action:
                        action: script.clear_kitchen_recipe
