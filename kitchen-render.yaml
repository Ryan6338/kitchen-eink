  // ============================================================
  // GET RECIPE DATA FROM HOME ASSISTANT
  // ============================================================

  std::string title = id(recipe_title).state;

  if (
    title.empty() ||
    title == "unknown" ||
    title == "unavailable"
  ) {
    title = "Kitchen Recipe Display";
  }


  std::string servings = id(recipe_servings).state;

  if (
    servings.empty() ||
    servings == "unknown" ||
    servings == "unavailable"
  ) {
    servings = "";
  }


  auto recipe_time_or_dash = [](std::string value) {
    if (
      value.empty() ||
      value == "unknown" ||
      value == "unavailable" ||
      value == "None" ||
      value == "none" ||
      value == "null"
    ) {
      return std::string("--");
    }

    return value;
  };

  std::string total_time = recipe_time_or_dash(id(recipe_total_time).state);
  std::string prep_time = recipe_time_or_dash(id(recipe_prep_time).state);
  std::string cook_time = recipe_time_or_dash(id(recipe_cook_time).state);


  std::string instruction = id(recipe_instruction).state;

  if (
    instruction.empty() ||
    instruction == "unknown" ||
    instruction == "unavailable"
  ) {

    instruction = "Waiting for recipe instructions...";
  }


  std::string ingredients = id(recipe_ingredients).state;

  if (
    ingredients.empty() ||
    ingredients == "unknown" ||
    ingredients == "unavailable"
  ) {

    ingredients = "Waiting for recipe ingredients...";
  }


  int step = 1;

  if (id(recipe_step).has_state()) {

    step = (int) id(recipe_step).state;

    if (step < 1)
      step = 1;
  }


  int step_count = 1;

  if (id(recipe_step_count).has_state()) {

    step_count = (int) id(recipe_step_count).state;

    if (step_count < 1)
      step_count = 1;
  }


  // ============================================================
  // RECIPE TITLE
  // ============================================================

  int title_y = 55;

  title_y = draw_wrapped(
    title,
    MARGIN,
    title_y,
    SCREEN_WIDTH - (MARGIN * 2),
    82,
    id(font_title),
    BLACK,
    225
  );


  // ============================================================
  // HEADER SEPARATOR
  // ============================================================

  const int separator_y = 245;

  it.filled_rectangle(
    MARGIN,
    separator_y,
    SCREEN_WIDTH - (MARGIN * 2),
    3,
    DARK_GRAY
  );


  // ============================================================
  // PAGE CONTENT
  // ============================================================

  if (id(current_page) == 0) {

    // ==========================================================
    // OVERVIEW PAGE
    // ==========================================================

    it.print(
      MARGIN,
      305,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Overview"
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        320,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    const int time_column_width = (SCREEN_WIDTH - (MARGIN * 2)) / 3;
    const int time_centres[3] = {
      MARGIN + (time_column_width / 2),
      MARGIN + time_column_width + (time_column_width / 2),
      MARGIN + (time_column_width * 2) + (time_column_width / 2)
    };
    const char *time_labels[3] = {"TOTAL", "PREP", "COOK"};
    const std::string time_values[3] = {total_time, prep_time, cook_time};

    it.filled_rectangle(
      MARGIN, 405, SCREEN_WIDTH - (MARGIN * 2), 2, LIGHT_GRAY
    );

    for (int i = 0; i < 3; i++) {
      it.print(
        time_centres[i], 470, id(font_time_label), MID_GRAY,
        TextAlign::CENTER, time_labels[i]
      );
      it.print(
        time_centres[i], 535, id(font_time_value), BLACK,
        TextAlign::CENTER, time_values[i].c_str()
      );
    }

    it.filled_rectangle(
      MARGIN + time_column_width, 440, 2, 130, PALE_GRAY
    );
    it.filled_rectangle(
      MARGIN + (time_column_width * 2), 440, 2, 130, PALE_GRAY
    );
    it.filled_rectangle(
      MARGIN, 605, SCREEN_WIDTH - (MARGIN * 2), 2, LIGHT_GRAY
    );

    it.printf(
      SCREEN_WIDTH / 2,
      700,
      id(font_meta),
      DARK_GRAY,
      TextAlign::CENTER,
      "%d steps",
      step_count
    );

  } else if (id(current_page) == 1) {

    // ==========================================================
    // INSTRUCTION PAGE
    // ==========================================================

    it.printf(
      MARGIN,
      295,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Step %d of %d",
      step,
      step_count
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        310,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    draw_wrapped(
      instruction,
      MARGIN,
      420,
      SCREEN_WIDTH - (MARGIN * 2),
      62,
      id(font_body),
      BLACK,
      NAV_TOP - 80
    );

  } else {

    // ==========================================================
    // INGREDIENT PAGE
    // ==========================================================

    it.print(
      MARGIN,
      295,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Ingredients"
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        310,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    draw_wrapped(
      ingredients,
      MARGIN,
      420,
      SCREEN_WIDTH - (MARGIN * 2),
      58,
      id(font_body),
      BLACK,
      NAV_TOP - 80
    );
  }

  // ============================================================
  // BOTTOM NAVIGATION
  // ============================================================


  // ------------------------------------------------------------
  // BACKGROUND
  // ------------------------------------------------------------

  it.filled_rectangle(
    0,
    NAV_TOP,
    SCREEN_WIDTH,
    SCREEN_HEIGHT - NAV_TOP,
    PALE_GRAY
  );


  // ------------------------------------------------------------
  // TOP BORDER
  // ------------------------------------------------------------

  it.filled_rectangle(
    0,
    NAV_TOP,
    SCREEN_WIDTH,
    3,
    DARK_GRAY
  );


  // ------------------------------------------------------------
  // VERTICAL SEPARATORS
  // ------------------------------------------------------------

  it.filled_rectangle(
    600,
    NAV_TOP,
    2,
    SCREEN_HEIGHT - NAV_TOP,
    MID_GRAY
  );


  it.filled_rectangle(
    1272,
    NAV_TOP,
    2,
    SCREEN_HEIGHT - NAV_TOP,
    MID_GRAY
  );


  // ============================================================
  // NAVIGATION LABELS
  // ============================================================

  if (id(current_page) == 0) {

    // The overview opens the cooking instructions from the centre button.
    it.print(
      300,
      1315,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "< Previous"
    );

    it.print(
      936,
      1315,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Start Cooking"
    );

    it.print(
      1572,
      1315,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "Next >"
    );

  } else if (id(current_page) == 1) {

    // ----------------------------------------------------------
    // PREVIOUS
    // ----------------------------------------------------------

    if (step > 1) {

      it.print(
        300,
        1315,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "< Previous"
      );

    } else {

      it.print(
        300,
        1315,
        id(font_button),
        MID_GRAY,
        TextAlign::CENTER,
        "< Previous"
      );
    }


    // ----------------------------------------------------------
    // INGREDIENTS
    // ----------------------------------------------------------

    it.print(
      936,
      1315,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Ingredients"
    );


    // ----------------------------------------------------------
    // NEXT
    // ----------------------------------------------------------

    if (step < step_count) {

      it.print(
        1572,
        1315,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "Next >"
      );

    } else {

      it.print(
        1572,
        1315,
        id(font_button),
        MID_GRAY,
        TextAlign::CENTER,
        "Next >"
      );
    }

  } else {

    // ==========================================================
    // INGREDIENTS PAGE
    // ==========================================================

    // Previous / Next aren't used on the ingredients page.

    it.print(
      300,
      1315,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "< Previous"
    );


    it.print(
      936,
      1315,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Instructions"
    );


    it.print(
      1572,
      1315,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "Next >"
    );
  }
