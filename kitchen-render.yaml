|-
  // ============================================================
  // COLOURS
  // ============================================================

  // The legacy colour names remain as semantic aliases so the layout code
  // stays readable: BLACK is primary text and WHITE is the page background.
  const Color BLACK          = Color(240, 244, 248);
  const Color DARK_GRAY      = Color(174, 186, 200);
  const Color MID_GRAY       = Color(105, 120, 139);
  const Color LIGHT_GRAY     = Color(48,  63,  81);
  const Color PALE_GRAY      = Color(25,  37,  52);
  const Color WHITE          = Color(9,   15,  25);
  const Color SURFACE        = Color(18,  29,  43);
  const Color SURFACE_RAISED = Color(29,  43,  60);
  const Color ACCENT         = Color(45,  212, 191);
  const Color ACCENT_DARK    = Color(18,  78,  74);
  const Color SUN_YELLOW     = Color(250, 190, 63);
  const Color CLOUD_BLUE     = Color(123, 148, 176);
  const Color RAIN_BLUE      = Color(74,  163, 223);
  const Color HUMIDITY_TEAL  = Color(55,  190, 176);
  const Color WIND_BLUE      = Color(142, 169, 199);


  // ============================================================
  // BASIC DISPLAY CONSTANTS
  // ============================================================

  const int SCREEN_WIDTH  = it.get_width();
  const int SCREEN_HEIGHT = it.get_height();

  const int MARGIN = 24;
  const int NAV_TOP = 418;


  // ============================================================
  // WORD WRAPPING FUNCTION
  // ============================================================

  auto draw_wrapped =
    [&](const std::string &text,
        int x,
        int y,
        int max_width,
        int line_height,
        auto *font,
        Color color,
        int max_y,
        bool render = true) -> int {

      std::string line;
      std::string word;

      auto draw_line = [&]() {

        if (line.empty())
          return;

        if (render && y + line_height <= max_y) {
          it.print(
            x,
            y,
            font,
            color,
            TextAlign::TOP_LEFT,
            line.c_str()
          );
        }

        // Always advance while measuring so callers can detect overflow.
        y += line_height;

        line.clear();
      };


      auto add_word = [&](const std::string &new_word) {

        if (new_word.empty())
          return;

        std::string candidate;

        if (line.empty())
          candidate = new_word;
        else
          candidate = line + " " + new_word;


        int x1;
        int y1;
        int width;
        int height;

        it.get_text_bounds(
          0,
          0,
          candidate.c_str(),
          font,
          TextAlign::TOP_LEFT,
          &x1,
          &y1,
          &width,
          &height
        );


        if (width > max_width && !line.empty()) {

          draw_line();
          line = new_word;

        } else {

          line = candidate;
        }
      };


      for (size_t i = 0; i < text.length(); i++) {

        char c = text[i];

        if (c == '\n') {

          add_word(word);
          word.clear();

          draw_line();

        } else if (c == ' ' || c == '\t') {

          add_word(word);
          word.clear();

        } else {

          word += c;
        }
      }


      add_word(word);

      if (!line.empty())
        draw_line();

      return y;
    };


  // ============================================================
  // COLOUR WEATHER SPRITES
  // ============================================================

  auto draw_weather_sprite =
    [&](const std::string &condition, int cx, int cy) {

      auto draw_thick_line =
        [&](int x1, int y1, int x2, int y2, Color color) {
          it.line(x1, y1, x2, y2, color);
          it.line(x1 - 1, y1, x2 - 1, y2, color);
          it.line(x1 + 1, y1, x2 + 1, y2, color);
          it.line(x1, y1 - 1, x2, y2 - 1, color);
          it.line(x1, y1 + 1, x2, y2 + 1, color);
        };

      auto draw_sun = [&](int x, int y) {
        it.filled_circle(x, y, 9, SUN_YELLOW);
        it.circle(x, y, 10, SUN_YELLOW);
        draw_thick_line(x, y - 18, x, y - 13, SUN_YELLOW);
        draw_thick_line(x, y + 13, x, y + 18, SUN_YELLOW);
        draw_thick_line(x - 18, y, x - 13, y, SUN_YELLOW);
        draw_thick_line(x + 13, y, x + 18, y, SUN_YELLOW);
        draw_thick_line(x - 13, y - 13, x - 10, y - 10, SUN_YELLOW);
        draw_thick_line(x + 10, y + 10, x + 13, y + 13, SUN_YELLOW);
        draw_thick_line(x + 10, y - 10, x + 13, y - 13, SUN_YELLOW);
        draw_thick_line(x - 13, y + 13, x - 10, y + 10, SUN_YELLOW);
      };

      auto draw_cloud = [&](int x, int y) {
        it.filled_circle(x - 10, y + 2, 9, CLOUD_BLUE);
        it.filled_circle(x, y - 4, 12, CLOUD_BLUE);
        it.filled_circle(x + 13, y + 2, 9, CLOUD_BLUE);
        it.filled_rectangle(x - 19, y + 1, 41, 11, CLOUD_BLUE);
      };

      auto draw_rain = [&](int x, int y, bool heavy) {
        draw_cloud(x, y - 7);
        const int spacing = heavy ? 8 : 12;
        const int count = heavy ? 4 : 3;
        for (int j = 0; j < count; j++) {
          int dx = x - ((count - 1) * spacing) / 2 + (j * spacing);
          draw_thick_line(dx + 2, y + 9, dx - 1, y + 18, RAIN_BLUE);
          if (heavy)
            draw_thick_line(dx + 4, y + 9, dx + 1, y + 18, RAIN_BLUE);
        }
      };

      if (condition == "sunny" || condition == "clear-night") {
        draw_sun(cx, cy);

      } else if (condition == "partlycloudy") {
        draw_sun(cx - 10, cy - 8);
        draw_cloud(cx + 5, cy + 4);

      } else if (condition == "rainy" || condition == "snowy-rainy") {
        draw_rain(cx, cy, false);

      } else if (condition == "pouring") {
        draw_rain(cx, cy, true);

      } else if (condition == "lightning" || condition == "lightning-rainy") {
        draw_cloud(cx, cy - 7);
        it.line(cx + 4, cy + 6, cx - 2, cy + 15, SUN_YELLOW);
        it.line(cx - 2, cy + 15, cx + 3, cy + 15, SUN_YELLOW);
        it.line(cx + 3, cy + 15, cx - 4, cy + 23, SUN_YELLOW);

      } else if (condition == "snowy" || condition == "hail") {
        draw_cloud(cx, cy - 7);
        for (int dx = -12; dx <= 12; dx += 12) {
          it.line(cx + dx - 3, cy + 14, cx + dx + 3, cy + 14, BLACK);
          it.line(cx + dx, cy + 11, cx + dx, cy + 17, BLACK);
        }

      } else if (condition == "fog") {
        draw_cloud(cx, cy - 8);
        it.line(cx - 20, cy + 11, cx + 20, cy + 11, WIND_BLUE);
        it.line(cx - 15, cy + 17, cx + 15, cy + 17, MID_GRAY);

      } else if (condition == "windy" || condition == "windy-variant") {
        it.line(cx - 20, cy - 8, cx + 14, cy - 8, WIND_BLUE);
        it.circle(cx + 14, cy - 4, 4, WIND_BLUE);
        it.line(cx - 20, cy, cx + 20, cy, WIND_BLUE);
        it.line(cx - 20, cy + 8, cx + 11, cy + 8, WIND_BLUE);

      } else {
        draw_cloud(cx, cy);
      }
    };


  // ============================================================
  // BACKGROUND
  // ============================================================

  // Draw the native-resolution wallpaper first. All dashboard panels and
  // recipe content are layered over it with opaque dark surfaces.
  it.image(0, 0, id(kitchen_background));


  // ============================================================
  // IDLE DISPLAY
  // ============================================================
  //
  // If there is no active recipe, display time/date/weather and
  // exit before drawing any recipe UI.
  //
  // ============================================================

  if (!id(recipe_active).state) {

    auto now = id(ha_time).now();

    // Layered panels give the dashboard depth without sacrificing contrast.
    it.filled_rectangle(18, 148, 764, 70, SURFACE);
    it.filled_rectangle(18, 148, 4, 70, ACCENT);
    it.filled_rectangle(18, 232, 764, 179, SURFACE);
    it.filled_rectangle(18, 232, 764, 2, LIGHT_GRAY);


    // ----------------------------------------------------------
    // TIME
    // ----------------------------------------------------------

    if (now.is_valid()) {

      char time_buffer[16];

      snprintf(
        time_buffer,
        sizeof(time_buffer),
        "%02d:%02d",
        now.hour,
        now.minute
      );

      it.print(
        SCREEN_WIDTH / 2,
        48,
        id(font_clock),
        BLACK,
        TextAlign::CENTER,
        time_buffer
      );


      // --------------------------------------------------------
      // DATE
      // --------------------------------------------------------

      static const char *days[] = {
        "",
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
      };

      static const char *months[] = {
        "",
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      };


      char date_buffer[80];

      snprintf(
        date_buffer,
        sizeof(date_buffer),
        "%s, %d %s",
        days[now.day_of_week],
        now.day_of_month,
        months[now.month]
      );

      it.print(
        SCREEN_WIDTH / 2,
        116,
        id(font_date),
        DARK_GRAY,
        TextAlign::CENTER,
        date_buffer
      );

    } else {

      it.print(
        SCREEN_WIDTH / 2,
        48,
        id(font_clock),
        BLACK,
        TextAlign::CENTER,
        "--:--"
      );
    }


    // ----------------------------------------------------------
    // CURRENT WEATHER
    // ----------------------------------------------------------

    it.filled_rectangle(MARGIN, 145, SCREEN_WIDTH - (MARGIN * 2), 1, LIGHT_GRAY);

    std::string current_condition = id(weather_condition).state;
    std::string condition_label = current_condition;

    if (condition_label.empty() || condition_label == "unknown" ||
        condition_label == "unavailable") {
      condition_label = "Weather unavailable";
    } else if (condition_label == "partlycloudy") {
      condition_label = "Partly cloudy";
    } else if (condition_label == "cloudy") {
      condition_label = "Cloudy";
    } else if (condition_label == "sunny") {
      condition_label = "Sunny";
    } else if (condition_label == "rainy") {
      condition_label = "Rain";
    } else if (condition_label == "pouring") {
      condition_label = "Heavy rain";
    } else if (condition_label == "lightning" ||
               condition_label == "lightning-rainy") {
      condition_label = "Thunderstorms";
    } else if (condition_label == "windy" ||
               condition_label == "windy-variant") {
      condition_label = "Windy";
    } else if (condition_label == "fog") {
      condition_label = "Fog";
    } else if (condition_label == "hail") {
      condition_label = "Hail";
    } else if (condition_label == "snowy") {
      condition_label = "Snow";
    } else if (condition_label == "snowy-rainy") {
      condition_label = "Sleet";
    } else if (condition_label == "clear-night") {
      condition_label = "Clear";
    } else if (condition_label == "exceptional") {
      condition_label = "Exceptional weather";
    }

    draw_weather_sprite(current_condition, 325, 188);

    if (id(weather_temperature).has_state()) {
      it.printf(
        400, 174, id(font_weather_temp), BLACK, TextAlign::CENTER,
        "%.0f\u00B0", id(weather_temperature).state
      );
    } else {
      it.print(
        400, 174, id(font_weather_temp), MID_GRAY, TextAlign::CENTER, "--\u00B0"
      );
    }

    it.print(
      505, 186, id(font_weather_condition), DARK_GRAY,
      TextAlign::CENTER, condition_label.c_str()
    );


    // ----------------------------------------------------------
    // SEVEN-DAY FORECAST
    // ----------------------------------------------------------

    it.filled_rectangle(MARGIN, 226, SCREEN_WIDTH - (MARGIN * 2), 2, ACCENT_DARK);

    std::string forecast_conditions[7] = {
      id(forecast_0_condition).state, id(forecast_1_condition).state,
      id(forecast_2_condition).state, id(forecast_3_condition).state,
      id(forecast_4_condition).state, id(forecast_5_condition).state,
      id(forecast_6_condition).state
    };
    std::string forecast_days[7] = {
      id(forecast_0_name).state, id(forecast_1_name).state,
      id(forecast_2_name).state, id(forecast_3_name).state,
      id(forecast_4_name).state, id(forecast_5_name).state,
      id(forecast_6_name).state
    };
    float forecast_highs[7] = {
      id(forecast_0_high).state, id(forecast_1_high).state,
      id(forecast_2_high).state, id(forecast_3_high).state,
      id(forecast_4_high).state, id(forecast_5_high).state,
      id(forecast_6_high).state
    };
    float forecast_lows[7] = {
      id(forecast_0_low).state, id(forecast_1_low).state,
      id(forecast_2_low).state, id(forecast_3_low).state,
      id(forecast_4_low).state, id(forecast_5_low).state,
      id(forecast_6_low).state
    };
    float forecast_rain[7] = {
      id(forecast_0_rain).state, id(forecast_1_rain).state,
      id(forecast_2_rain).state, id(forecast_3_rain).state,
      id(forecast_4_rain).state, id(forecast_5_rain).state,
      id(forecast_6_rain).state
    };
    float forecast_precipitation[7] = {
      id(forecast_0_precipitation).state, id(forecast_1_precipitation).state,
      id(forecast_2_precipitation).state, id(forecast_3_precipitation).state,
      id(forecast_4_precipitation).state, id(forecast_5_precipitation).state,
      id(forecast_6_precipitation).state
    };
    float forecast_humidity[7] = {
      id(forecast_0_humidity).state, id(forecast_1_humidity).state,
      id(forecast_2_humidity).state, id(forecast_3_humidity).state,
      id(forecast_4_humidity).state, id(forecast_5_humidity).state,
      id(forecast_6_humidity).state
    };
    float forecast_wind[7] = {
      id(forecast_0_wind).state, id(forecast_1_wind).state,
      id(forecast_2_wind).state, id(forecast_3_wind).state,
      id(forecast_4_wind).state, id(forecast_5_wind).state,
      id(forecast_6_wind).state
    };
    bool has_high[7] = {
      id(forecast_0_high).has_state(), id(forecast_1_high).has_state(),
      id(forecast_2_high).has_state(), id(forecast_3_high).has_state(),
      id(forecast_4_high).has_state(), id(forecast_5_high).has_state(),
      id(forecast_6_high).has_state()
    };
    bool has_low[7] = {
      id(forecast_0_low).has_state(), id(forecast_1_low).has_state(),
      id(forecast_2_low).has_state(), id(forecast_3_low).has_state(),
      id(forecast_4_low).has_state(), id(forecast_5_low).has_state(),
      id(forecast_6_low).has_state()
    };
    bool has_rain[7] = {
      id(forecast_0_rain).has_state(), id(forecast_1_rain).has_state(),
      id(forecast_2_rain).has_state(), id(forecast_3_rain).has_state(),
      id(forecast_4_rain).has_state(), id(forecast_5_rain).has_state(),
      id(forecast_6_rain).has_state()
    };
    bool has_precipitation[7] = {
      id(forecast_0_precipitation).has_state(), id(forecast_1_precipitation).has_state(),
      id(forecast_2_precipitation).has_state(), id(forecast_3_precipitation).has_state(),
      id(forecast_4_precipitation).has_state(), id(forecast_5_precipitation).has_state(),
      id(forecast_6_precipitation).has_state()
    };
    bool has_humidity[7] = {
      id(forecast_0_humidity).has_state(), id(forecast_1_humidity).has_state(),
      id(forecast_2_humidity).has_state(), id(forecast_3_humidity).has_state(),
      id(forecast_4_humidity).has_state(), id(forecast_5_humidity).has_state(),
      id(forecast_6_humidity).has_state()
    };
    bool has_wind[7] = {
      id(forecast_0_wind).has_state(), id(forecast_1_wind).has_state(),
      id(forecast_2_wind).has_state(), id(forecast_3_wind).has_state(),
      id(forecast_4_wind).has_state(), id(forecast_5_wind).has_state(),
      id(forecast_6_wind).has_state()
    };

    for (int i = 0; i < 7; i++) {
      has_high[i] = has_high[i] && !std::isnan(forecast_highs[i]);
      has_low[i] = has_low[i] && !std::isnan(forecast_lows[i]);
      has_rain[i] = has_rain[i] && !std::isnan(forecast_rain[i]);
      has_precipitation[i] = has_precipitation[i] && !std::isnan(forecast_precipitation[i]);
      has_humidity[i] = has_humidity[i] && !std::isnan(forecast_humidity[i]);
      has_wind[i] = has_wind[i] && !std::isnan(forecast_wind[i]);
    }

    std::string wind_unit = id(forecast_wind_unit).state;
    if (wind_unit == "unknown" || wind_unit == "unavailable")
      wind_unit = "";

    std::string precipitation_unit = id(forecast_precipitation_unit).state;
    if (precipitation_unit == "unknown" || precipitation_unit == "unavailable")
      precipitation_unit = "";

    static const char *short_days[] = {
      "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"
    };

    int forecast_count = 7;

    // Providers return different forecast lengths. Drop unavailable entries
    // from the end instead of showing an empty day card.
    while (forecast_count > 0) {
      const int last = forecast_count - 1;
      const bool missing_name =
        forecast_days[last].empty() ||
        forecast_days[last] == "--" ||
        forecast_days[last] == "unknown" ||
        forecast_days[last] == "unavailable";
      const bool missing_condition =
        forecast_conditions[last].empty() ||
        forecast_conditions[last] == "unknown" ||
        forecast_conditions[last] == "unavailable";

      if (!missing_name || !missing_condition ||
          has_high[last] || has_low[last] || has_rain[last])
        break;

      forecast_count--;
    }

    const int forecast_width = SCREEN_WIDTH - (MARGIN * 2);
    const int cell_width = forecast_width / (forecast_count > 0 ? forecast_count : 1);

    for (int i = 0; i < forecast_count; i++) {
      const int center_x = MARGIN + (cell_width * i) + (cell_width / 2);
      std::string day_label = forecast_days[i];

      if (i == 0)
        it.filled_rectangle(MARGIN, 236, cell_width, 175, SURFACE_RAISED);

      if (day_label.empty() || day_label == "unknown" ||
          day_label == "unavailable") {
        day_label = now.is_valid()
          ? short_days[(now.day_of_week - 1 + i) % 7]
          : "--";
      } else if (i == 0 && now.is_valid() &&
                 day_label == short_days[now.day_of_week - 1]) {
        day_label = "Today";
      }

      if (i > 0)
        it.filled_rectangle(MARGIN + (cell_width * i), 242, 1, 160, LIGHT_GRAY);

      it.print(
        center_x, 242, id(font_forecast_day), i == 0 ? ACCENT : DARK_GRAY,
        TextAlign::CENTER, day_label.c_str()
      );

      draw_weather_sprite(forecast_conditions[i], center_x, 281);

      if (has_high[i] && has_low[i]) {
        it.printf(
          center_x, 316, id(font_forecast_temp), BLACK,
          TextAlign::CENTER, "%.0f\u00B0 / %.0f\u00B0", forecast_highs[i], forecast_lows[i]
        );
      } else {
        it.print(
          center_x, 316, id(font_forecast_temp), MID_GRAY,
          TextAlign::CENTER, "--\u00B0 / --\u00B0"
        );
      }

      // Small rain-drop sprite beside the precipitation probability.
      it.filled_circle(center_x - 32, 348, 3, RAIN_BLUE);
      it.line(center_x - 32, 339, center_x - 36, 346, RAIN_BLUE);
      it.line(center_x - 32, 339, center_x - 28, 346, RAIN_BLUE);

      if (has_rain[i]) {
        it.printf(
          center_x + 6, 340, id(font_forecast_rain), DARK_GRAY,
          TextAlign::CENTER, "%.0f%%", forecast_rain[i]
        );
      } else if (has_precipitation[i]) {
        it.printf(
          center_x + 6, 340, id(font_forecast_rain), DARK_GRAY,
          TextAlign::CENTER, "%.1f%s",
          forecast_precipitation[i], precipitation_unit.c_str()
        );
      } else {
        it.print(
          center_x + 6, 340, id(font_forecast_rain), MID_GRAY,
          TextAlign::CENTER, "--"
        );
      }

      // Humidity drop sprite and relative humidity.
      it.filled_circle(center_x - 32, 375, 3, HUMIDITY_TEAL);
      it.line(center_x - 32, 366, center_x - 36, 373, HUMIDITY_TEAL);
      it.line(center_x - 32, 366, center_x - 28, 373, HUMIDITY_TEAL);

      if (has_humidity[i]) {
        it.printf(
          center_x + 6, 367, id(font_forecast_rain), DARK_GRAY,
          TextAlign::CENTER, "%.0f%% RH", forecast_humidity[i]
        );
      } else {
        it.print(
          center_x + 6, 367, id(font_forecast_rain), MID_GRAY,
          TextAlign::CENTER, "--% RH"
        );
      }

      // Wind sprite: two waves centred vertically against the speed label.
      it.line(center_x - 38, 395, center_x - 34, 392, WIND_BLUE);
      it.line(center_x - 34, 392, center_x - 30, 395, WIND_BLUE);
      it.line(center_x - 30, 395, center_x - 26, 398, WIND_BLUE);
      it.line(center_x - 26, 398, center_x - 22, 395, WIND_BLUE);
      it.line(center_x - 22, 395, center_x - 18, 392, WIND_BLUE);
      it.line(center_x - 18, 392, center_x - 14, 395, WIND_BLUE);

      it.line(center_x - 36, 403, center_x - 32, 400, WIND_BLUE);
      it.line(center_x - 32, 400, center_x - 28, 403, WIND_BLUE);
      it.line(center_x - 28, 403, center_x - 24, 406, WIND_BLUE);
      it.line(center_x - 24, 406, center_x - 20, 403, WIND_BLUE);
      it.line(center_x - 20, 403, center_x - 16, 400, WIND_BLUE);

      if (has_wind[i]) {
        it.printf(
          center_x + 8, 391, id(font_forecast_rain), DARK_GRAY,
          TextAlign::CENTER, "%.0f %s", forecast_wind[i], wind_unit.c_str()
        );
      } else {
        it.print(
          center_x + 8, 391, id(font_forecast_rain), MID_GRAY,
          TextAlign::CENTER, "-- wind"
        );
      }
    }

    it.print(
      SCREEN_WIDTH / 2, 452, id(font_meta), MID_GRAY,
      TextAlign::CENTER, "Kitchen"
    );

    // Do not draw any recipe UI.
    return;
  }


  // ============================================================
  // GET RECIPE DATA FROM HOME ASSISTANT
  // ============================================================

  std::string title = id(recipe_title).state;

  if (
    title.empty() ||
    title == "unknown" ||
    title == "unavailable"
  ) {
    title = "Kitchen Recipe Display";
  }


  std::string servings = id(recipe_servings).state;

  if (
    servings.empty() ||
    servings == "unknown" ||
    servings == "unavailable"
  ) {
    servings = "";
  }


  auto recipe_time_or_dash = [](std::string value) {
    if (
      value.empty() ||
      value == "unknown" ||
      value == "unavailable" ||
      value == "None" ||
      value == "none" ||
      value == "null"
    ) {
      return std::string("--");
    }

    return value;
  };

  std::string total_time = recipe_time_or_dash(id(recipe_total_time).state);
  std::string prep_time = recipe_time_or_dash(id(recipe_prep_time).state);
  std::string cook_time = recipe_time_or_dash(id(recipe_cook_time).state);


  std::string instruction = id(recipe_instruction).state;

  if (
    instruction.empty() ||
    instruction == "unknown" ||
    instruction == "unavailable"
  ) {

    instruction = "Waiting for recipe instructions...";
  }


  std::string ingredients = id(recipe_ingredients).state;

  if (
    ingredients.empty() ||
    ingredients == "unknown" ||
    ingredients == "unavailable"
  ) {

    ingredients = "Waiting for recipe ingredients...";
  }

  // Roboto does not include every Unicode number-form glyph used by recipe
  // imports. Convert both single-character and composed fractions to ASCII.
  auto replace_all = [](
    std::string &text,
    const std::string &from,
    const std::string &to
  ) {
    size_t position = 0;

    while ((position = text.find(from, position)) != std::string::npos) {
      text.replace(position, from.length(), to);
      position += to.length();
    }
  };

  replace_all(ingredients, "¼", "1/4");
  replace_all(ingredients, "½", "1/2");
  replace_all(ingredients, "¾", "3/4");
  replace_all(ingredients, "⅐", "1/7");
  replace_all(ingredients, "⅑", "1/9");
  replace_all(ingredients, "⅒", "1/10");
  replace_all(ingredients, "⅓", "1/3");
  replace_all(ingredients, "⅔", "2/3");
  replace_all(ingredients, "⅕", "1/5");
  replace_all(ingredients, "⅖", "2/5");
  replace_all(ingredients, "⅗", "3/5");
  replace_all(ingredients, "⅘", "4/5");
  replace_all(ingredients, "⅙", "1/6");
  replace_all(ingredients, "⅚", "5/6");
  replace_all(ingredients, "⅛", "1/8");
  replace_all(ingredients, "⅜", "3/8");
  replace_all(ingredients, "⅝", "5/8");
  replace_all(ingredients, "⅞", "7/8");

  replace_all(ingredients, "⁄", "/");
  replace_all(ingredients, "⁰", "0");
  replace_all(ingredients, "¹", "1");
  replace_all(ingredients, "²", "2");
  replace_all(ingredients, "³", "3");
  replace_all(ingredients, "⁴", "4");
  replace_all(ingredients, "⁵", "5");
  replace_all(ingredients, "⁶", "6");
  replace_all(ingredients, "⁷", "7");
  replace_all(ingredients, "⁸", "8");
  replace_all(ingredients, "⁹", "9");
  replace_all(ingredients, "₀", "0");
  replace_all(ingredients, "₁", "1");
  replace_all(ingredients, "₂", "2");
  replace_all(ingredients, "₃", "3");
  replace_all(ingredients, "₄", "4");
  replace_all(ingredients, "₅", "5");
  replace_all(ingredients, "₆", "6");
  replace_all(ingredients, "₇", "7");
  replace_all(ingredients, "₈", "8");
  replace_all(ingredients, "₉", "9");


  int step = 1;

  if (id(recipe_step).has_state()) {

    step = (int) id(recipe_step).state;

    if (step < 1)
      step = 1;
  }


  int step_count = 1;

  if (id(recipe_step_count).has_state()) {

    step_count = (int) id(recipe_step_count).state;

    if (step_count < 1)
      step_count = 1;
  }


  // ============================================================
  // RECIPE TITLE
  // ============================================================

  it.filled_rectangle(14, 12, 4, 76, ACCENT);

  int title_y = 12;

  title_y = draw_wrapped(
    title,
    MARGIN,
    title_y,
    SCREEN_WIDTH - (MARGIN * 2),
    37,
    id(font_title),
    BLACK,
    88
  );


  // ============================================================
  // HEADER SEPARATOR
  // ============================================================

  const int separator_y = 96;

  it.filled_rectangle(
    MARGIN,
    separator_y,
    SCREEN_WIDTH - (MARGIN * 2),
    2,
    ACCENT_DARK
  );


  // ============================================================
  // PAGE CONTENT
  // ============================================================

  if (id(current_page) == 0) {

    // ==========================================================
    // OVERVIEW PAGE
    // ==========================================================

    it.print(
      MARGIN,
      112,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Overview"
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        117,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    const int time_column_width = (SCREEN_WIDTH - (MARGIN * 2)) / 3;
    const int time_centres[3] = {
      MARGIN + (time_column_width / 2),
      MARGIN + time_column_width + (time_column_width / 2),
      MARGIN + (time_column_width * 2) + (time_column_width / 2)
    };
    const char *time_labels[3] = {"TOTAL", "PREP", "COOK"};
    const std::string time_values[3] = {total_time, prep_time, cook_time};

    it.filled_rectangle(
      MARGIN, 158, SCREEN_WIDTH - (MARGIN * 2), 92, SURFACE
    );
    it.filled_rectangle(
      MARGIN, 158, SCREEN_WIDTH - (MARGIN * 2), 2, ACCENT_DARK
    );

    for (int i = 0; i < 3; i++) {
      it.print(
        time_centres[i], 183, id(font_time_label), MID_GRAY,
        TextAlign::CENTER, time_labels[i]
      );
      it.print(
        time_centres[i], 210, id(font_time_value), BLACK,
        TextAlign::CENTER, time_values[i].c_str()
      );
    }

    it.filled_rectangle(
      MARGIN + time_column_width, 174, 1, 62, LIGHT_GRAY
    );
    it.filled_rectangle(
      MARGIN + (time_column_width * 2), 174, 1, 62, LIGHT_GRAY
    );
    it.filled_rectangle(
      MARGIN, 248, SCREEN_WIDTH - (MARGIN * 2), 2, LIGHT_GRAY
    );

    it.printf(
      SCREEN_WIDTH / 2,
      282,
      id(font_meta),
      DARK_GRAY,
      TextAlign::CENTER,
      "%d steps",
      step_count
    );

  } else if (id(current_page) == 1) {

    // ==========================================================
    // INSTRUCTION PAGE
    // ==========================================================

    it.printf(
      MARGIN,
      110,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Step %d of %d",
      step,
      step_count
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        116,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    // ----------------------------------------------------------
    // STEP PROGRESS
    // ----------------------------------------------------------

    const int progress_x = MARGIN;
    const int progress_y = 151;
    const int progress_width = SCREEN_WIDTH - (MARGIN * 2);
    const int progress_height = 10;
    int progress_step = step;

    it.filled_rectangle(
      18, 171, SCREEN_WIDTH - 36, NAV_TOP - 181, SURFACE
    );

    if (progress_step < 0)
      progress_step = 0;
    if (progress_step > step_count)
      progress_step = step_count;

    const int progress_fill =
      ((progress_width - 4) * progress_step) / step_count;

    it.filled_rectangle(
      progress_x, progress_y, progress_width, progress_height, PALE_GRAY
    );
    it.rectangle(
      progress_x, progress_y, progress_width, progress_height, DARK_GRAY
    );
    it.filled_rectangle(
      progress_x + 2,
      progress_y + 2,
      progress_fill,
      progress_height - 4,
      ACCENT
    );

    draw_wrapped(
      instruction,
      MARGIN,
      177,
      SCREEN_WIDTH - (MARGIN * 2),
      27,
      id(font_body),
      BLACK,
      NAV_TOP - 12
    );

  } else {

    // ==========================================================
    // INGREDIENT PAGE
    // ==========================================================

    it.print(
      MARGIN,
      110,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Ingredients"
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        116,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    const int ingredients_y = 153;
    const int ingredients_max_y = NAV_TOP - 10;
    const int ingredients_gap = 24;
    const int ingredients_width =
      (SCREEN_WIDTH - (MARGIN * 2) - ingredients_gap) / 2;
    const int ingredients_right_x = MARGIN + ingredients_width + ingredients_gap;
    const int ingredient_bullet_indent = 16;
    const int ingredient_text_width = ingredients_width - ingredient_bullet_indent;

    it.filled_rectangle(
      18, 145, SCREEN_WIDTH - 36, NAV_TOP - 155, SURFACE
    );

    std::vector<std::string> ingredient_items;
    std::string ingredient_item;

    for (size_t i = 0; i <= ingredients.length(); i++) {
      const bool at_end = i == ingredients.length();
      const char c = at_end ? '\n' : ingredients[i];

      if (c == '\n') {
        if (!ingredient_item.empty())
          ingredient_items.push_back(ingredient_item);
        ingredient_item.clear();
      } else if (c != '\r') {
        ingredient_item += c;
      }
    }

    auto build_ingredient_column =
      [&](int first, int last) -> std::string {
        std::string column;

        for (int i = first; i < last; i++) {
          if (!column.empty())
            column += "\n";
          column += ingredient_items[i];
        }

        return column;
      };

    auto find_ingredient_split =
      [&](auto *font, int line_height, int &end_y) -> int {
        const int item_count = (int) ingredient_items.size();

        if (item_count < 2) {
          std::string only_column = build_ingredient_column(0, item_count);
          end_y = draw_wrapped(
            only_column, MARGIN, ingredients_y, ingredient_text_width,
            line_height, font, BLACK, ingredients_max_y, false
          );
          return item_count;
        }

        int best_split = 1;
        int best_end_y = 2147483647;

        // Keep each ingredient intact and choose the split whose wrapped
        // columns have the closest maximum height.
        for (int split = 1; split < item_count; split++) {
          std::string left = build_ingredient_column(0, split);
          std::string right = build_ingredient_column(split, item_count);
          int left_end_y = draw_wrapped(
            left, MARGIN, ingredients_y, ingredient_text_width,
            line_height, font, BLACK, ingredients_max_y, false
          );
          int right_end_y = draw_wrapped(
            right, ingredients_right_x, ingredients_y, ingredient_text_width,
            line_height, font, BLACK, ingredients_max_y, false
          );
          int candidate_end_y = left_end_y > right_end_y
            ? left_end_y
            : right_end_y;

          if (candidate_end_y < best_end_y) {
            best_end_y = candidate_end_y;
            best_split = split;
          }
        }

        end_y = best_end_y;
        return best_split;
      };

    auto *ingredients_font = id(font_body);
    int ingredients_line_height = 27;
    int ingredients_end_y = ingredients_y;
    int ingredients_split = find_ingredient_split(
      ingredients_font, ingredients_line_height, ingredients_end_y
    );

    // Resize only when the optimally balanced pair of columns cannot fit.
    if (ingredients_end_y > ingredients_max_y) {
      ingredients_font = id(font_body_compact);
      ingredients_line_height = 21;
      ingredients_split = find_ingredient_split(
        ingredients_font, ingredients_line_height, ingredients_end_y
      );
    }

    if (ingredients_end_y > ingredients_max_y) {
      ingredients_font = id(font_body_small);
      ingredients_line_height = 17;
      ingredients_split = find_ingredient_split(
        ingredients_font, ingredients_line_height, ingredients_end_y
      );
    }

    auto draw_ingredient_items =
      [&](int first, int last, int column_x) {
        int item_y = ingredients_y;

        for (int i = first; i < last; i++) {
          if (item_y + ingredients_line_height <= ingredients_max_y) {
            it.filled_circle(
              column_x + 4,
              item_y + (ingredients_line_height / 2),
              3,
              ACCENT
            );
          }

          // The first and all wrapped lines share this text x-coordinate,
          // producing a hanging indent to the right of the bullet.
          item_y = draw_wrapped(
            ingredient_items[i],
            column_x + ingredient_bullet_indent,
            item_y,
            ingredient_text_width,
            ingredients_line_height,
            ingredients_font,
            BLACK,
            ingredients_max_y
          );
        }
      };

    draw_ingredient_items(0, ingredients_split, MARGIN);
    draw_ingredient_items(
      ingredients_split,
      (int) ingredient_items.size(),
      ingredients_right_x
    );

    it.filled_rectangle(
      MARGIN + ingredients_width + (ingredients_gap / 2),
      ingredients_y,
      1,
      ingredients_max_y - ingredients_y,
      LIGHT_GRAY
    );
  }

  // ============================================================
  // BOTTOM NAVIGATION
  // ============================================================


  // ------------------------------------------------------------
  // BACKGROUND
  // ------------------------------------------------------------

  it.filled_rectangle(
    0,
    NAV_TOP,
    SCREEN_WIDTH,
    SCREEN_HEIGHT - NAV_TOP,
    SURFACE_RAISED
  );

  // The centre action is the primary control on every recipe page.
  it.filled_rectangle(
    256,
    NAV_TOP,
    288,
    SCREEN_HEIGHT - NAV_TOP,
    ACCENT_DARK
  );


  // ------------------------------------------------------------
  // TOP BORDER
  // ------------------------------------------------------------

  it.filled_rectangle(
    0,
    NAV_TOP,
    SCREEN_WIDTH,
    2,
    ACCENT
  );


  // ------------------------------------------------------------
  // VERTICAL SEPARATORS
  // ------------------------------------------------------------

  it.filled_rectangle(
    256,
    NAV_TOP,
    1,
    SCREEN_HEIGHT - NAV_TOP,
    LIGHT_GRAY
  );


  it.filled_rectangle(
    544,
    NAV_TOP,
    1,
    SCREEN_HEIGHT - NAV_TOP,
    LIGHT_GRAY
  );


  // ============================================================
  // NAVIGATION LABELS
  // ============================================================

  if (id(current_page) == 0) {

    // Start with ingredients, then use the centre button to toggle instructions.
    it.print(
      128,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "< Previous"
    );

    it.print(
      400,
      449,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Start Cooking"
    );

    it.print(
      672,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "Next >"
    );

  } else if (id(current_page) == 1) {

    // ----------------------------------------------------------
    // PREVIOUS
    // ----------------------------------------------------------

    if (step > 1) {

      it.print(
        128,
        449,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "< Previous"
      );

    } else {

      it.print(
        128,
        449,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "< Overview"
      );
    }


    // ----------------------------------------------------------
    // INGREDIENTS
    // ----------------------------------------------------------

    it.print(
      400,
      449,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Ingredients"
    );


    // ----------------------------------------------------------
    // NEXT
    // ----------------------------------------------------------

    if (step < step_count) {

      it.print(
        672,
        449,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "Next >"
      );

    } else {

      it.print(
        672,
        449,
        id(font_button),
        MID_GRAY,
        TextAlign::CENTER,
        "Next >"
      );
    }

  } else {

    // ==========================================================
    // INGREDIENTS PAGE
    // ==========================================================

    // Previous / Next aren't used on the ingredients page.

    it.print(
      128,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "< Previous"
    );


    it.print(
      400,
      449,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Instructions"
    );


    it.print(
      672,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "Next >"
    );
  }
