|-
  // ============================================================
  // COLOURS
  // ============================================================

  const Color BLACK      = Color(0,   0,   0);
  const Color DARK_GRAY  = Color(68,  68,  68);
  const Color MID_GRAY   = Color(136, 136, 136);
  const Color LIGHT_GRAY = Color(221, 221, 221);
  const Color PALE_GRAY  = Color(238, 238, 238);
  const Color WHITE      = Color(255, 255, 255);


  // ============================================================
  // BASIC DISPLAY CONSTANTS
  // ============================================================

  const int SCREEN_WIDTH  = it.get_width();
  const int SCREEN_HEIGHT = it.get_height();

  const int MARGIN = 70;
  const int NAV_TOP = 1230;


  // ============================================================
  // WORD WRAPPING FUNCTION
  // ============================================================

  auto draw_wrapped =
    [&](const std::string &text,
        int x,
        int y,
        int max_width,
        int line_height,
        auto *font,
        Color color,
        int max_y) -> int {

      std::string line;
      std::string word;

      auto draw_line = [&]() {

        if (!line.empty() && y + line_height <= max_y) {

          it.print(
            x,
            y,
            font,
            color,
            TextAlign::TOP_LEFT,
            line.c_str()
          );

          y += line_height;
        }

        line.clear();
      };


      auto add_word = [&](const std::string &new_word) {

        if (new_word.empty())
          return;

        std::string candidate;

        if (line.empty())
          candidate = new_word;
        else
          candidate = line + " " + new_word;


        int x1;
        int y1;
        int width;
        int height;

        it.get_text_bounds(
          0,
          0,
          candidate.c_str(),
          font,
          TextAlign::TOP_LEFT,
          &x1,
          &y1,
          &width,
          &height
        );


        if (width > max_width && !line.empty()) {

          draw_line();
          line = new_word;

        } else {

          line = candidate;
        }
      };


      for (size_t i = 0; i < text.length(); i++) {

        char c = text[i];

        if (c == '\n') {

          add_word(word);
          word.clear();

          draw_line();

        } else if (c == ' ' || c == '\t') {

          add_word(word);
          word.clear();

        } else {

          word += c;
        }
      }


      add_word(word);

      if (!line.empty())
        draw_line();

      return y;
    };


  // ============================================================
  // MONOCHROME WEATHER SPRITES
  // ============================================================

  auto draw_weather_sprite =
    [&](const std::string &condition, int cx, int cy) {

      auto draw_thick_line =
        [&](int x1, int y1, int x2, int y2, Color color) {
          it.line(x1, y1, x2, y2, color);
          it.line(x1 - 1, y1, x2 - 1, y2, color);
          it.line(x1 + 1, y1, x2 + 1, y2, color);
          it.line(x1, y1 - 1, x2, y2 - 1, color);
          it.line(x1, y1 + 1, x2, y2 + 1, color);
        };

      auto draw_sun = [&](int x, int y) {
        it.filled_circle(x, y, 20, MID_GRAY);
        it.circle(x, y, 21, BLACK);
        draw_thick_line(x, y - 37, x, y - 27, BLACK);
        draw_thick_line(x, y + 27, x, y + 37, BLACK);
        draw_thick_line(x - 37, y, x - 27, y, BLACK);
        draw_thick_line(x + 27, y, x + 37, y, BLACK);
        draw_thick_line(x - 27, y - 27, x - 20, y - 20, BLACK);
        draw_thick_line(x + 20, y + 20, x + 27, y + 27, BLACK);
        draw_thick_line(x + 20, y - 20, x + 27, y - 27, BLACK);
        draw_thick_line(x - 27, y + 27, x - 20, y + 20, BLACK);
      };

      auto draw_cloud = [&](int x, int y) {
        it.filled_circle(x - 23, y + 5, 19, DARK_GRAY);
        it.filled_circle(x, y - 7, 27, DARK_GRAY);
        it.filled_circle(x + 29, y + 4, 20, DARK_GRAY);
        it.filled_rectangle(x - 42, y + 3, 91, 24, DARK_GRAY);
      };

      auto draw_rain = [&](int x, int y, bool heavy) {
        draw_cloud(x, y - 15);
        const int spacing = heavy ? 18 : 28;
        const int count = heavy ? 4 : 3;
        for (int j = 0; j < count; j++) {
          int dx = x - ((count - 1) * spacing) / 2 + (j * spacing);
          draw_thick_line(dx + 5, y + 20, dx - 3, y + 39, BLACK);
          if (heavy)
            draw_thick_line(dx + 9, y + 20, dx + 1, y + 39, BLACK);
        }
      };

      if (condition == "sunny" || condition == "clear-night") {
        draw_sun(cx, cy);

      } else if (condition == "partlycloudy") {
        draw_sun(cx - 22, cy - 17);
        draw_cloud(cx + 10, cy + 9);

      } else if (condition == "rainy" || condition == "snowy-rainy") {
        draw_rain(cx, cy, false);

      } else if (condition == "pouring") {
        draw_rain(cx, cy, true);

      } else if (condition == "lightning" || condition == "lightning-rainy") {
        draw_cloud(cx, cy - 15);
        it.line(cx + 8, cy + 13, cx - 4, cy + 32, BLACK);
        it.line(cx - 4, cy + 32, cx + 7, cy + 32, BLACK);
        it.line(cx + 7, cy + 32, cx - 8, cy + 48, BLACK);

      } else if (condition == "snowy" || condition == "hail") {
        draw_cloud(cx, cy - 15);
        for (int dx = -28; dx <= 28; dx += 28) {
          it.line(cx + dx - 6, cy + 29, cx + dx + 6, cy + 29, BLACK);
          it.line(cx + dx, cy + 23, cx + dx, cy + 35, BLACK);
          it.line(cx + dx - 4, cy + 25, cx + dx + 4, cy + 33, BLACK);
          it.line(cx + dx + 4, cy + 25, cx + dx - 4, cy + 33, BLACK);
        }

      } else if (condition == "fog") {
        draw_cloud(cx, cy - 18);
        it.line(cx - 44, cy + 22, cx + 44, cy + 22, DARK_GRAY);
        it.line(cx - 34, cy + 34, cx + 34, cy + 34, MID_GRAY);

      } else if (condition == "windy" || condition == "windy-variant") {
        it.line(cx - 43, cy - 18, cx + 30, cy - 18, DARK_GRAY);
        it.circle(cx + 30, cy - 8, 10, DARK_GRAY);
        it.line(cx - 43, cy, cx + 43, cy, BLACK);
        it.line(cx - 43, cy + 18, cx + 23, cy + 18, DARK_GRAY);

      } else {
        draw_cloud(cx, cy);
      }
    };


  // ============================================================
  // BACKGROUND
  // ============================================================

  it.fill(WHITE);


  // ============================================================
  // IDLE DISPLAY
  // ============================================================
  //
  // If there is no active recipe, display time/date/weather and
  // exit before drawing any recipe UI.
  //
  // ============================================================

  if (!id(recipe_active).state) {

    auto now = id(ha_time).now();


    // ----------------------------------------------------------
    // TIME
    // ----------------------------------------------------------

    if (now.is_valid()) {

      char time_buffer[16];

      snprintf(
