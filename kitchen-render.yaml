|-
  // ============================================================
  // COLOURS
  // ============================================================

  // The legacy colour names remain as semantic aliases so the layout code
  // stays readable: BLACK is primary text and WHITE is the page background.
  const Color BLACK          = Color(240, 244, 248);
  const Color DARK_GRAY      = Color(174, 186, 200);
  const Color MID_GRAY       = Color(105, 120, 139);
  const Color LIGHT_GRAY     = Color(48,  63,  81);
  const Color PALE_GRAY      = Color(25,  37,  52);
  const Color WHITE          = Color(9,   15,  25);
  const Color SURFACE        = Color(18,  29,  43);
  const Color SURFACE_RAISED = Color(29,  43,  60);
  const Color ACCENT         = Color(45,  212, 191);
  const Color ACCENT_DARK    = Color(18,  78,  74);


  // ============================================================
  // BASIC DISPLAY CONSTANTS
  // ============================================================

  const int SCREEN_WIDTH  = it.get_width();
  const int SCREEN_HEIGHT = it.get_height();

  const int MARGIN = 24;
  const int NAV_TOP = 418;


  // ============================================================
  // WORD WRAPPING FUNCTION
  // ============================================================

  auto draw_wrapped =
    [&](const std::string &text,
        int x,
        int y,
        int max_width,
        int line_height,
        auto *font,
        Color color,
        int max_y,
        bool render = true) -> int {

      std::string line;
      std::string word;

      auto draw_line = [&]() {

        if (line.empty())
          return;

        if (render && y + line_height <= max_y) {
          it.print(
            x,
            y,
            font,
            color,
            TextAlign::TOP_LEFT,
            line.c_str()
          );
        }

        // Always advance while measuring so callers can detect overflow.
        y += line_height;

        line.clear();
      };


      auto add_word = [&](const std::string &new_word) {

        if (new_word.empty())
          return;

        std::string candidate;

        if (line.empty())
          candidate = new_word;
        else
          candidate = line + " " + new_word;


        int x1;
        int y1;
        int width;
        int height;

        it.get_text_bounds(
          0,
          0,
          candidate.c_str(),
          font,
          TextAlign::TOP_LEFT,
          &x1,
          &y1,
          &width,
          &height
        );


        if (width > max_width && !line.empty()) {

          draw_line();
          line = new_word;

        } else {

          line = candidate;
        }
      };


      for (size_t i = 0; i < text.length(); i++) {

        char c = text[i];

        if (c == '\n') {

          add_word(word);
          word.clear();

          draw_line();

        } else if (c == ' ' || c == '\t') {

          add_word(word);
          word.clear();

        } else {

          word += c;
        }
      }


      add_word(word);

      if (!line.empty())
        draw_line();

      return y;
    };


  // ============================================================
  // BACKGROUND
  // ============================================================

  // Draw the native-resolution wallpaper first. All dashboard panels and
  // recipe content are layered over it with opaque dark surfaces.
  // The idle clock uses the orange daytime artwork while the sun is above
  // the horizon and the purple artwork after sunset. Recipe pages retain
  // the existing dark kitchen background below.
  if (!id(recipe_active).state) {
    if (id(sun_state).state == "above_horizon") {
      it.image(0, 0, id(day_clock_background));
    } else {
      it.image(0, 0, id(night_clock_background));
    }
  } else {
    it.image(0, 0, id(kitchen_background));
  }


  // ============================================================
  // IDLE CLOCK
  // ============================================================
  //
  // When there is no active recipe, the front page is intentionally
  // reduced to a single large hours-and-minutes readout.
  //
  // ============================================================

  if (!id(recipe_active).state) {
    auto now = id(ha_time).now();
    char time_buffer[16];

    if (now.is_valid()) {
      snprintf(
        time_buffer,
        sizeof(time_buffer),
        "%02d:%02d",
        now.hour,
        now.minute
      );
    } else {
      snprintf(time_buffer, sizeof(time_buffer), "--:--");
    }

    it.print(
      SCREEN_WIDTH / 2,
      SCREEN_HEIGHT / 2,
      id(font_clock),
      BLACK,
      TextAlign::CENTER,
      time_buffer
    );

    // Do not draw any recipe UI.
    return;
  }


  // ============================================================
  // GET RECIPE DATA FROM HOME ASSISTANT
  // ============================================================

  std::string title = id(recipe_title).state;

  if (
    title.empty() ||
    title == "unknown" ||
    title == "unavailable"
  ) {
    title = "Kitchen Recipe Display";
  }


  std::string servings = id(recipe_servings).state;

  if (
    servings.empty() ||
    servings == "unknown" ||
    servings == "unavailable"
  ) {
    servings = "";
  }


  auto recipe_time_or_dash = [](std::string value) {
    if (
      value.empty() ||
      value == "unknown" ||
      value == "unavailable" ||
      value == "None" ||
      value == "none" ||
      value == "null"
    ) {
      return std::string("--");
    }

    return value;
  };

  std::string total_time = recipe_time_or_dash(id(recipe_total_time).state);
  std::string prep_time = recipe_time_or_dash(id(recipe_prep_time).state);
  std::string cook_time = recipe_time_or_dash(id(recipe_cook_time).state);


  std::string instruction = id(recipe_instruction).state;

  if (
    instruction.empty() ||
    instruction == "unknown" ||
    instruction == "unavailable"
  ) {

    instruction = "Waiting for recipe instructions...";
  }


  std::string ingredients = id(recipe_ingredients).state;

  if (
    ingredients.empty() ||
    ingredients == "unknown" ||
    ingredients == "unavailable"
  ) {

    ingredients = "Waiting for recipe ingredients...";
  }

  // Roboto does not include every Unicode number-form glyph used by recipe
  // imports. Convert both single-character and composed fractions to ASCII.
  auto replace_all = [](
    std::string &text,
    const std::string &from,
    const std::string &to
  ) {
    size_t position = 0;

    while ((position = text.find(from, position)) != std::string::npos) {
      text.replace(position, from.length(), to);
      position += to.length();
    }
  };

  replace_all(ingredients, "¼", "1/4");
  replace_all(ingredients, "½", "1/2");
  replace_all(ingredients, "¾", "3/4");
  replace_all(ingredients, "⅐", "1/7");
  replace_all(ingredients, "⅑", "1/9");
  replace_all(ingredients, "⅒", "1/10");
  replace_all(ingredients, "⅓", "1/3");
  replace_all(ingredients, "⅔", "2/3");
  replace_all(ingredients, "⅕", "1/5");
  replace_all(ingredients, "⅖", "2/5");
  replace_all(ingredients, "⅗", "3/5");
  replace_all(ingredients, "⅘", "4/5");
  replace_all(ingredients, "⅙", "1/6");
  replace_all(ingredients, "⅚", "5/6");
  replace_all(ingredients, "⅛", "1/8");
  replace_all(ingredients, "⅜", "3/8");
  replace_all(ingredients, "⅝", "5/8");
  replace_all(ingredients, "⅞", "7/8");

  replace_all(ingredients, "⁄", "/");
  replace_all(ingredients, "⁰", "0");
  replace_all(ingredients, "¹", "1");
  replace_all(ingredients, "²", "2");
  replace_all(ingredients, "³", "3");
  replace_all(ingredients, "⁴", "4");
  replace_all(ingredients, "⁵", "5");
  replace_all(ingredients, "⁶", "6");
  replace_all(ingredients, "⁷", "7");
  replace_all(ingredients, "⁸", "8");
  replace_all(ingredients, "⁹", "9");
  replace_all(ingredients, "₀", "0");
  replace_all(ingredients, "₁", "1");
  replace_all(ingredients, "₂", "2");
  replace_all(ingredients, "₃", "3");
  replace_all(ingredients, "₄", "4");
  replace_all(ingredients, "₅", "5");
  replace_all(ingredients, "₆", "6");
  replace_all(ingredients, "₇", "7");
  replace_all(ingredients, "₈", "8");
  replace_all(ingredients, "₉", "9");


  int step = 1;

  if (id(recipe_step).has_state()) {

    step = (int) id(recipe_step).state;

    if (step < 1)
      step = 1;
  }


  int step_count = 1;

  if (id(recipe_step_count).has_state()) {

    step_count = (int) id(recipe_step_count).state;

    if (step_count < 1)
      step_count = 1;
  }


  // ============================================================
  // RECIPE TITLE
  // ============================================================

  it.filled_rectangle(14, 12, 4, 76, ACCENT);

  int title_y = 12;

  title_y = draw_wrapped(
    title,
    MARGIN,
    title_y,
    SCREEN_WIDTH - (MARGIN * 2),
    37,
    id(font_title),
    BLACK,
    88
  );


  // ============================================================
  // HEADER SEPARATOR
  // ============================================================

  const int separator_y = 96;

  it.filled_rectangle(
    MARGIN,
    separator_y,
    SCREEN_WIDTH - (MARGIN * 2),
    2,
    ACCENT_DARK
  );


  // ============================================================
  // PAGE CONTENT
  // ============================================================

  if (id(current_page) == 0) {

    // ==========================================================
    // OVERVIEW PAGE
    // ==========================================================

    it.print(
      MARGIN,
      112,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Overview"
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        117,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    const int time_column_width = (SCREEN_WIDTH - (MARGIN * 2)) / 3;
    const int time_centres[3] = {
      MARGIN + (time_column_width / 2),
      MARGIN + time_column_width + (time_column_width / 2),
      MARGIN + (time_column_width * 2) + (time_column_width / 2)
    };
    const char *time_labels[3] = {"TOTAL", "PREP", "COOK"};
    const std::string time_values[3] = {total_time, prep_time, cook_time};

    it.filled_rectangle(
      MARGIN, 158, SCREEN_WIDTH - (MARGIN * 2), 92, SURFACE
    );
    it.filled_rectangle(
      MARGIN, 158, SCREEN_WIDTH - (MARGIN * 2), 2, ACCENT_DARK
    );

    for (int i = 0; i < 3; i++) {
      it.print(
        time_centres[i], 183, id(font_time_label), MID_GRAY,
        TextAlign::CENTER, time_labels[i]
      );
      it.print(
        time_centres[i], 210, id(font_time_value), BLACK,
        TextAlign::CENTER, time_values[i].c_str()
      );
    }

    it.filled_rectangle(
      MARGIN + time_column_width, 174, 1, 62, LIGHT_GRAY
    );
    it.filled_rectangle(
      MARGIN + (time_column_width * 2), 174, 1, 62, LIGHT_GRAY
    );
    it.filled_rectangle(
      MARGIN, 248, SCREEN_WIDTH - (MARGIN * 2), 2, LIGHT_GRAY
    );

    it.printf(
      SCREEN_WIDTH / 2,
      282,
      id(font_meta),
      DARK_GRAY,
      TextAlign::CENTER,
      "%d steps",
      step_count
    );

  } else if (id(current_page) == 1) {

    // ==========================================================
    // INSTRUCTION PAGE
    // ==========================================================

    it.printf(
      MARGIN,
      110,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Step %d of %d",
      step,
      step_count
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        116,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    // ----------------------------------------------------------
    // STEP PROGRESS
    // ----------------------------------------------------------

    const int progress_x = MARGIN;
    const int progress_y = 151;
    const int progress_width = SCREEN_WIDTH - (MARGIN * 2);
    const int progress_height = 10;
    int progress_step = step;

    it.filled_rectangle(
      18, 171, SCREEN_WIDTH - 36, NAV_TOP - 181, SURFACE
    );

    if (progress_step < 0)
      progress_step = 0;
    if (progress_step > step_count)
      progress_step = step_count;

    const int progress_fill =
      ((progress_width - 4) * progress_step) / step_count;

    it.filled_rectangle(
      progress_x, progress_y, progress_width, progress_height, PALE_GRAY
    );
    it.rectangle(
      progress_x, progress_y, progress_width, progress_height, DARK_GRAY
    );
    it.filled_rectangle(
      progress_x + 2,
      progress_y + 2,
      progress_fill,
      progress_height - 4,
      ACCENT
    );

    draw_wrapped(
      instruction,
      MARGIN,
      177,
      SCREEN_WIDTH - (MARGIN * 2),
      27,
      id(font_body),
      BLACK,
      NAV_TOP - 12
    );

  } else {

    // ==========================================================
    // INGREDIENT PAGE
    // ==========================================================

    it.print(
      MARGIN,
      110,
      id(font_heading),
      BLACK,
      TextAlign::TOP_LEFT,
      "Ingredients"
    );

    if (!servings.empty()) {
      it.printf(
        SCREEN_WIDTH - MARGIN,
        116,
        id(font_meta),
        DARK_GRAY,
        TextAlign::TOP_RIGHT,
        "%s servings",
        servings.c_str()
      );
    }

    const int ingredients_y = 153;
    const int ingredients_max_y = NAV_TOP - 10;
    const int ingredients_gap = 24;
    const int ingredients_width =
      (SCREEN_WIDTH - (MARGIN * 2) - ingredients_gap) / 2;
    const int ingredients_right_x = MARGIN + ingredients_width + ingredients_gap;
    const int ingredient_bullet_indent = 16;
    const int ingredient_text_width = ingredients_width - ingredient_bullet_indent;

    it.filled_rectangle(
      18, 145, SCREEN_WIDTH - 36, NAV_TOP - 155, SURFACE
    );

    std::vector<std::string> ingredient_items;
    std::string ingredient_item;

    for (size_t i = 0; i <= ingredients.length(); i++) {
      const bool at_end = i == ingredients.length();
      const char c = at_end ? '\n' : ingredients[i];

      if (c == '\n') {
        if (!ingredient_item.empty())
          ingredient_items.push_back(ingredient_item);
        ingredient_item.clear();
      } else if (c != '\r') {
        ingredient_item += c;
      }
    }

    auto build_ingredient_column =
      [&](int first, int last) -> std::string {
        std::string column;

        for (int i = first; i < last; i++) {
          if (!column.empty())
            column += "\n";
          column += ingredient_items[i];
        }

        return column;
      };

    auto find_ingredient_split =
      [&](auto *font, int line_height, int &end_y) -> int {
        const int item_count = (int) ingredient_items.size();

        if (item_count < 2) {
          std::string only_column = build_ingredient_column(0, item_count);
          end_y = draw_wrapped(
            only_column, MARGIN, ingredients_y, ingredient_text_width,
            line_height, font, BLACK, ingredients_max_y, false
          );
          return item_count;
        }

        int best_split = 1;
        int best_end_y = 2147483647;

        // Keep each ingredient intact and choose the split whose wrapped
        // columns have the closest maximum height.
        for (int split = 1; split < item_count; split++) {
          std::string left = build_ingredient_column(0, split);
          std::string right = build_ingredient_column(split, item_count);
          int left_end_y = draw_wrapped(
            left, MARGIN, ingredients_y, ingredient_text_width,
            line_height, font, BLACK, ingredients_max_y, false
          );
          int right_end_y = draw_wrapped(
            right, ingredients_right_x, ingredients_y, ingredient_text_width,
            line_height, font, BLACK, ingredients_max_y, false
          );
          int candidate_end_y = left_end_y > right_end_y
            ? left_end_y
            : right_end_y;

          if (candidate_end_y < best_end_y) {
            best_end_y = candidate_end_y;
            best_split = split;
          }
        }

        end_y = best_end_y;
        return best_split;
      };

    auto *ingredients_font = id(font_body);
    int ingredients_line_height = 27;
    int ingredients_end_y = ingredients_y;
    int ingredients_split = find_ingredient_split(
      ingredients_font, ingredients_line_height, ingredients_end_y
    );

    // Resize only when the optimally balanced pair of columns cannot fit.
    if (ingredients_end_y > ingredients_max_y) {
      ingredients_font = id(font_body_compact);
      ingredients_line_height = 21;
      ingredients_split = find_ingredient_split(
        ingredients_font, ingredients_line_height, ingredients_end_y
      );
    }

    if (ingredients_end_y > ingredients_max_y) {
      ingredients_font = id(font_body_small);
      ingredients_line_height = 17;
      ingredients_split = find_ingredient_split(
        ingredients_font, ingredients_line_height, ingredients_end_y
      );
    }

    auto draw_ingredient_items =
      [&](int first, int last, int column_x) {
        int item_y = ingredients_y;

        for (int i = first; i < last; i++) {
          if (item_y + ingredients_line_height <= ingredients_max_y) {
            it.filled_circle(
              column_x + 4,
              item_y + (ingredients_line_height / 2),
              3,
              ACCENT
            );
          }

          // The first and all wrapped lines share this text x-coordinate,
          // producing a hanging indent to the right of the bullet.
          item_y = draw_wrapped(
            ingredient_items[i],
            column_x + ingredient_bullet_indent,
            item_y,
            ingredient_text_width,
            ingredients_line_height,
            ingredients_font,
            BLACK,
            ingredients_max_y
          );
        }
      };

    draw_ingredient_items(0, ingredients_split, MARGIN);
    draw_ingredient_items(
      ingredients_split,
      (int) ingredient_items.size(),
      ingredients_right_x
    );

    it.filled_rectangle(
      MARGIN + ingredients_width + (ingredients_gap / 2),
      ingredients_y,
      1,
      ingredients_max_y - ingredients_y,
      LIGHT_GRAY
    );
  }

  // ============================================================
  // BOTTOM NAVIGATION
  // ============================================================


  // ------------------------------------------------------------
  // BACKGROUND
  // ------------------------------------------------------------

  it.filled_rectangle(
    0,
    NAV_TOP,
    SCREEN_WIDTH,
    SCREEN_HEIGHT - NAV_TOP,
    SURFACE_RAISED
  );

  // The centre action is the primary control on every recipe page.
  it.filled_rectangle(
    256,
    NAV_TOP,
    288,
    SCREEN_HEIGHT - NAV_TOP,
    ACCENT_DARK
  );


  // ------------------------------------------------------------
  // TOP BORDER
  // ------------------------------------------------------------

  it.filled_rectangle(
    0,
    NAV_TOP,
    SCREEN_WIDTH,
    2,
    ACCENT
  );


  // ------------------------------------------------------------
  // VERTICAL SEPARATORS
  // ------------------------------------------------------------

  it.filled_rectangle(
    256,
    NAV_TOP,
    1,
    SCREEN_HEIGHT - NAV_TOP,
    LIGHT_GRAY
  );


  it.filled_rectangle(
    544,
    NAV_TOP,
    1,
    SCREEN_HEIGHT - NAV_TOP,
    LIGHT_GRAY
  );


  // ============================================================
  // NAVIGATION LABELS
  // ============================================================

  if (id(current_page) == 0) {

    // Start with ingredients, then use the centre button to toggle instructions.
    it.print(
      128,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "< Previous"
    );

    it.print(
      400,
      449,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Start Cooking"
    );

    it.print(
      672,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "Next >"
    );

  } else if (id(current_page) == 1) {

    // ----------------------------------------------------------
    // PREVIOUS
    // ----------------------------------------------------------

    if (step > 1) {

      it.print(
        128,
        449,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "< Previous"
      );

    } else {

      it.print(
        128,
        449,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "< Overview"
      );
    }


    // ----------------------------------------------------------
    // INGREDIENTS
    // ----------------------------------------------------------

    it.print(
      400,
      449,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Ingredients"
    );


    // ----------------------------------------------------------
    // NEXT
    // ----------------------------------------------------------

    if (step < step_count) {

      it.print(
        672,
        449,
        id(font_button),
        BLACK,
        TextAlign::CENTER,
        "Next >"
      );

    } else {

      it.print(
        672,
        449,
        id(font_button),
        MID_GRAY,
        TextAlign::CENTER,
        "Next >"
      );
    }

  } else {

    // ==========================================================
    // INGREDIENTS PAGE
    // ==========================================================

    // Previous / Next aren't used on the ingredients page.

    it.print(
      128,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "< Previous"
    );


    it.print(
      400,
      449,
      id(font_button),
      BLACK,
      TextAlign::CENTER,
      "Instructions"
    );


    it.print(
      672,
      449,
      id(font_button),
      MID_GRAY,
      TextAlign::CENTER,
      "Next >"
    );
  }
