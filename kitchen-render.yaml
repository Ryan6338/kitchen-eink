        now.minute
      );

      it.print(
        SCREEN_WIDTH / 2,
        300,
        id(font_clock),
        BLACK,
        TextAlign::CENTER,
        time_buffer
      );


      // --------------------------------------------------------
      // DATE
      // --------------------------------------------------------

      static const char *days[] = {
        "",
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
      };

      static const char *months[] = {
        "",
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      };


      char date_buffer[80];

      snprintf(
        date_buffer,
        sizeof(date_buffer),
        "%s, %d %s",
        days[now.day_of_week],
        now.day_of_month,
        months[now.month]
      );

      it.print(
        SCREEN_WIDTH / 2,
        500,
        id(font_date),
        DARK_GRAY,
        TextAlign::CENTER,
        date_buffer
      );

    } else {

      it.print(
        SCREEN_WIDTH / 2,
        300,
        id(font_clock),
        BLACK,
        TextAlign::CENTER,
        "--:--"
