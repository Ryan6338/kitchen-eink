    }


    // ----------------------------------------------------------
    // CURRENT WEATHER
    // ----------------------------------------------------------

    it.filled_rectangle(300, 590, SCREEN_WIDTH - 600, 3, LIGHT_GRAY);

    std::string current_condition = id(weather_condition).state;
    std::string condition_label = current_condition;

    if (condition_label.empty() || condition_label == "unknown" ||
        condition_label == "unavailable") {
      condition_label = "Weather unavailable";
    } else if (condition_label == "partlycloudy") {
      condition_label = "Partly cloudy";
    } else if (condition_label == "cloudy") {
      condition_label = "Cloudy";
    } else if (condition_label == "sunny") {
      condition_label = "Sunny";
    } else if (condition_label == "rainy") {
      condition_label = "Rain";
    } else if (condition_label == "pouring") {
      condition_label = "Heavy rain";
    } else if (condition_label == "lightning" ||
               condition_label == "lightning-rainy") {
      condition_label = "Thunderstorms";
    } else if (condition_label == "windy" ||
               condition_label == "windy-variant") {
      condition_label = "Windy";
    } else if (condition_label == "fog") {
      condition_label = "Fog";
    } else if (condition_label == "hail") {
      condition_label = "Hail";
    } else if (condition_label == "snowy") {
      condition_label = "Snow";
    } else if (condition_label == "snowy-rainy") {
      condition_label = "Sleet";
    } else if (condition_label == "clear-night") {
      condition_label = "Clear";
    } else if (condition_label == "exceptional") {
      condition_label = "Exceptional weather";
    }

    draw_weather_sprite(current_condition, 745, 687);

    if (id(weather_temperature).has_state()) {
      it.printf(
        970, 665, id(font_weather_temp), BLACK, TextAlign::CENTER,
        "%.0f\u00B0", id(weather_temperature).state
      );
    } else {
      it.print(
        970, 665, id(font_weather_temp), MID_GRAY, TextAlign::CENTER, "--\u00B0"
      );
    }

    it.print(
      970, 747, id(font_weather_condition), DARK_GRAY,
      TextAlign::CENTER, condition_label.c_str()
    );


    // ----------------------------------------------------------
    // SEVEN-DAY FORECAST
    // ----------------------------------------------------------

    it.filled_rectangle(MARGIN, 815, SCREEN_WIDTH - (MARGIN * 2), 3, LIGHT_GRAY);

    std::string forecast_conditions[7] = {
      id(forecast_0_condition).state, id(forecast_1_condition).state,
      id(forecast_2_condition).state, id(forecast_3_condition).state,
      id(forecast_4_condition).state, id(forecast_5_condition).state,
      id(forecast_6_condition).state
    };
    std::string forecast_days[7] = {
      id(forecast_0_name).state, id(forecast_1_name).state,
      id(forecast_2_name).state, id(forecast_3_name).state,
      id(forecast_4_name).state, id(forecast_5_name).state,
      id(forecast_6_name).state
    };
    float forecast_highs[7] = {
      id(forecast_0_high).state, id(forecast_1_high).state,
      id(forecast_2_high).state, id(forecast_3_high).state,
      id(forecast_4_high).state, id(forecast_5_high).state,
      id(forecast_6_high).state
    };
    float forecast_lows[7] = {
      id(forecast_0_low).state, id(forecast_1_low).state,
      id(forecast_2_low).state, id(forecast_3_low).state,
      id(forecast_4_low).state, id(forecast_5_low).state,
      id(forecast_6_low).state
    };
    float forecast_rain[7] = {
      id(forecast_0_rain).state, id(forecast_1_rain).state,
      id(forecast_2_rain).state, id(forecast_3_rain).state,
      id(forecast_4_rain).state, id(forecast_5_rain).state,
      id(forecast_6_rain).state
    };
    float forecast_precipitation[7] = {
      id(forecast_0_precipitation).state, id(forecast_1_precipitation).state,
      id(forecast_2_precipitation).state, id(forecast_3_precipitation).state,
      id(forecast_4_precipitation).state, id(forecast_5_precipitation).state,
      id(forecast_6_precipitation).state
    };
    float forecast_humidity[7] = {
      id(forecast_0_humidity).state, id(forecast_1_humidity).state,
      id(forecast_2_humidity).state, id(forecast_3_humidity).state,
      id(forecast_4_humidity).state, id(forecast_5_humidity).state,
      id(forecast_6_humidity).state
    };
    float forecast_wind[7] = {
      id(forecast_0_wind).state, id(forecast_1_wind).state,
      id(forecast_2_wind).state, id(forecast_3_wind).state,
      id(forecast_4_wind).state, id(forecast_5_wind).state,
      id(forecast_6_wind).state
    };
    bool has_high[7] = {
      id(forecast_0_high).has_state(), id(forecast_1_high).has_state(),
      id(forecast_2_high).has_state(), id(forecast_3_high).has_state(),
      id(forecast_4_high).has_state(), id(forecast_5_high).has_state(),
      id(forecast_6_high).has_state()
    };
    bool has_low[7] = {
      id(forecast_0_low).has_state(), id(forecast_1_low).has_state(),
      id(forecast_2_low).has_state(), id(forecast_3_low).has_state(),
      id(forecast_4_low).has_state(), id(forecast_5_low).has_state(),
      id(forecast_6_low).has_state()
    };
    bool has_rain[7] = {
      id(forecast_0_rain).has_state(), id(forecast_1_rain).has_state(),
      id(forecast_2_rain).has_state(), id(forecast_3_rain).has_state(),
      id(forecast_4_rain).has_state(), id(forecast_5_rain).has_state(),
      id(forecast_6_rain).has_state()
    };
    bool has_precipitation[7] = {
      id(forecast_0_precipitation).has_state(), id(forecast_1_precipitation).has_state(),
      id(forecast_2_precipitation).has_state(), id(forecast_3_precipitation).has_state(),
      id(forecast_4_precipitation).has_state(), id(forecast_5_precipitation).has_state(),
      id(forecast_6_precipitation).has_state()
    };
    bool has_humidity[7] = {
      id(forecast_0_humidity).has_state(), id(forecast_1_humidity).has_state(),
      id(forecast_2_humidity).has_state(), id(forecast_3_humidity).has_state(),
      id(forecast_4_humidity).has_state(), id(forecast_5_humidity).has_state(),
      id(forecast_6_humidity).has_state()
    };
    bool has_wind[7] = {
      id(forecast_0_wind).has_state(), id(forecast_1_wind).has_state(),
      id(forecast_2_wind).has_state(), id(forecast_3_wind).has_state(),
      id(forecast_4_wind).has_state(), id(forecast_5_wind).has_state(),
      id(forecast_6_wind).has_state()
    };

    for (int i = 0; i < 7; i++) {
      has_high[i] = has_high[i] && !std::isnan(forecast_highs[i]);
      has_low[i] = has_low[i] && !std::isnan(forecast_lows[i]);
      has_rain[i] = has_rain[i] && !std::isnan(forecast_rain[i]);
      has_precipitation[i] = has_precipitation[i] && !std::isnan(forecast_precipitation[i]);
      has_humidity[i] = has_humidity[i] && !std::isnan(forecast_humidity[i]);
      has_wind[i] = has_wind[i] && !std::isnan(forecast_wind[i]);
    }

    std::string wind_unit = id(forecast_wind_unit).state;
    if (wind_unit == "unknown" || wind_unit == "unavailable")
      wind_unit = "";

    std::string precipitation_unit = id(forecast_precipitation_unit).state;
    if (precipitation_unit == "unknown" || precipitation_unit == "unavailable")
      precipitation_unit = "";

    static const char *short_days[] = {
      "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"
    };

    int forecast_count = 7;

    // Providers return different forecast lengths. Drop unavailable entries
    // from the end instead of showing an empty day card.
    while (forecast_count > 0) {
      const int last = forecast_count - 1;
      const bool missing_name =
        forecast_days[last].empty() ||
        forecast_days[last] == "--" ||
        forecast_days[last] == "unknown" ||
        forecast_days[last] == "unavailable";
      const bool missing_condition =
        forecast_conditions[last].empty() ||
        forecast_conditions[last] == "unknown" ||
        forecast_conditions[last] == "unavailable";

      if (!missing_name || !missing_condition ||
          has_high[last] || has_low[last] || has_rain[last])
        break;

      forecast_count--;
    }

    const int forecast_width = SCREEN_WIDTH - (MARGIN * 2);
    const int cell_width = forecast_width / (forecast_count > 0 ? forecast_count : 1);

    for (int i = 0; i < forecast_count; i++) {
      const int center_x = MARGIN + (cell_width * i) + (cell_width / 2);
      std::string day_label = forecast_days[i];

      if (day_label.empty() || day_label == "unknown" ||
          day_label == "unavailable") {
        day_label = now.is_valid()
          ? short_days[(now.day_of_week - 1 + i) % 7]
          : "--";
      } else if (i == 0 && now.is_valid() &&
                 day_label == short_days[now.day_of_week - 1]) {
        day_label = "Today";
      }

      if (i > 0)
        it.filled_rectangle(MARGIN + (cell_width * i), 850, 2, 400, PALE_GRAY);

      it.print(
        center_x, 870, id(font_forecast_day), DARK_GRAY,
        TextAlign::CENTER, day_label.c_str()
      );

      draw_weather_sprite(forecast_conditions[i], center_x, 965);

      if (has_high[i] && has_low[i]) {
        it.printf(
          center_x, 1052, id(font_forecast_temp), BLACK,
          TextAlign::CENTER, "H %.0f\u00B0  L %.0f\u00B0", forecast_highs[i], forecast_lows[i]
        );
      } else {
        it.print(
          center_x, 1052, id(font_forecast_temp), MID_GRAY,
          TextAlign::CENTER, "H --\u00B0  L --\u00B0"
        );
      }

      // Small rain-drop sprite beside the precipitation probability.
      it.filled_circle(center_x - 88, 1134, 5, MID_GRAY);
      it.line(center_x - 88, 1119, center_x - 94, 1130, MID_GRAY);
      it.line(center_x - 88, 1119, center_x - 82, 1130, MID_GRAY);

      if (has_rain[i]) {
        it.printf(
          center_x + 20, 1124, id(font_forecast_rain), DARK_GRAY,
          TextAlign::CENTER, "%.0f%% rain", forecast_rain[i]
        );
      } else if (has_precipitation[i]) {
        it.printf(
          center_x + 20, 1124, id(font_forecast_rain), DARK_GRAY,
          TextAlign::CENTER, "%.1f %s rain",
          forecast_precipitation[i], precipitation_unit.c_str()
        );
      } else {
        it.print(
          center_x + 20, 1124, id(font_forecast_rain), MID_GRAY,
          TextAlign::CENTER, "-- rain"
        );
      }

      // Humidity drop sprite and relative humidity.
      it.filled_circle(center_x - 88, 1181, 5, MID_GRAY);
      it.line(center_x - 88, 1166, center_x - 94, 1177, MID_GRAY);
      it.line(center_x - 88, 1166, center_x - 82, 1177, MID_GRAY);

      if (has_humidity[i]) {
        it.printf(
          center_x + 20, 1171, id(font_forecast_rain), DARK_GRAY,
          TextAlign::CENTER, "%.0f%% RH", forecast_humidity[i]
        );
      } else {
        it.print(
          center_x + 20, 1171, id(font_forecast_rain), MID_GRAY,
          TextAlign::CENTER, "--% RH"
        );
      }

      // Wind sprite: two waves centred vertically against the speed label.
      it.line(center_x - 96, 1212, center_x - 90, 1208, MID_GRAY);
      it.line(center_x - 90, 1208, center_x - 84, 1212, MID_GRAY);
      it.line(center_x - 84, 1212, center_x - 78, 1216, MID_GRAY);
      it.line(center_x - 78, 1216, center_x - 72, 1212, MID_GRAY);
      it.line(center_x - 72, 1212, center_x - 66, 1208, MID_GRAY);
      it.line(center_x - 66, 1208, center_x - 60, 1212, MID_GRAY);

      it.line(center_x - 92, 1224, center_x - 86, 1220, DARK_GRAY);
      it.line(center_x - 86, 1220, center_x - 80, 1224, DARK_GRAY);
      it.line(center_x - 80, 1224, center_x - 74, 1228, DARK_GRAY);
      it.line(center_x - 74, 1228, center_x - 68, 1224, DARK_GRAY);
      it.line(center_x - 68, 1224, center_x - 62, 1220, DARK_GRAY);

      if (has_wind[i]) {
