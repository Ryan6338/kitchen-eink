id: kitchen_ui

displays: main_display

touchscreens: main_touchscreen

buffer_size: 25%

# Disable scrolling on the LVGL root canvas as well as individual pages.
# The full-width navigation bars otherwise make LVGL create a horizontal
# scrollbar because their labels fill the footer edge-to-edge.
scrollbar_mode: "OFF"

scrollable: false

bottom_layer:
  bg_image_src: day_clock_background
  bg_image_opa: COVER

pages:

  - id: clock_page

    scrollbar_mode: "OFF"

    scrollable: false

    bg_opa: TRANSP

    widgets:

      - obj:

          x: 10

          y: 70

          width: 460

          height: 520

          radius: 20

          pad_all: 0

          bg_opa: TRANSP

          border_width: 0

          border_color: 0x444444

          border_opa: 70%

          shadow_color: 0x020812

          shadow_opa: 0%

          shadow_width: 24

          widgets:

            - label:

                id: clock_hours

                text: "--"

                text_font: font_clock

                text_color: 0xF67E3B

                align: CENTER

      - obj:

          x: 528

          y: 70

          width: 460

          height: 520

          radius: 20

          pad_all: 0

          bg_opa: TRANSP


          border_width: 0

          border_color: 0x444444

          border_opa: 70%

          shadow_color: 0x020812

          shadow_opa: 0%

          shadow_width: 24

          widgets:

            - label:

                id: clock_minutes

                text: "--"

                text_font: font_clock

                text_color: 0xFFE7D6

                align: CENTER

  - id: meal_planner_page

    scrollbar_mode: "OFF"

    scrollable: false

    bg_opa: TRANSP

    on_swipe_right:
      then:
        - homeassistant.action:
            action: input_select.select_option
            data:
              entity_id: input_select.kitchen_display_page
              option: clock
        - lvgl.page.show: clock_page

    widgets:
      - label:
          x: 24
          y: 12
          width: 976
          height: 58
          text: "This week's meal plan"
          text_align: LEFT
          text_font: font_meal_planner_title
          text_color: 0xFFFFFF
          bg_color: 0xE69D6F
          bg_opa: 60%
          radius: 14

      - button:
          id: meal_card_1
          x: 24
          y: 82
          width: 232
          height: 430
          radius: 18
          bg_color: 0xE69D6F
          bg_opa: 60%
          widgets:
            - label:
                x: 12
                y: 120
                width: 208
                height: 150
                text: "?"
                text_align: CENTER
                text_font: font_meal_question
                text_color: 0xFFFFFF
            - label:
                id: meal_card_1_caption
                x: 12
                y: 18
                width: 208
                height: 58
                text: "Unassigned"
                text_align: CENTER
                text_font: font_body_compact
                text_color: 0xFFFFFF
                long_mode: WRAP
          on_click:
            - homeassistant.action:
                action: script.kitchen_open_meal
