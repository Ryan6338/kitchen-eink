# ===================================================================
# KITCHEN RECIPE DISPLAY
# Shared between the PC simulator and the eventual E1003.
# ===================================================================


# -------------------------------------------------------------------
# DEFAULT SUBSTITUTIONS
# -------------------------------------------------------------------
#
# Hardware configs can override these.
#
# Simulator:
#   display_refresh_delay: 3s
#
# E1003:
#   display_refresh_delay: 0s
#
# -------------------------------------------------------------------

substitutions:
  display_refresh_delay: 0s


# -------------------------------------------------------------------
# INITIAL DISPLAY REFRESH
# -------------------------------------------------------------------

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_display


# -------------------------------------------------------------------
# FONTS
# -------------------------------------------------------------------
#
# 4 BPP gives us 16 levels of font anti-aliasing, which is useful
# when approximating a 16-level grayscale e-paper display.
#
# -------------------------------------------------------------------

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: font_clock
    size: 220
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_date
    size: 52
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_weather_temp
    size: 110
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_weather_condition
    size: 48
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_forecast_day
    size: 32
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_forecast_temp
    size: 35
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_forecast_rain
    size: 28
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_body
    size: 42
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_meta
    size: 32
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_time_label
    size: 24
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_time_value
    size: 34
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_heading
    size: 54
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_title
    size: 72
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_button
    size: 38
    bpp: 4


# -------------------------------------------------------------------
# LOCAL UI STATE
# -------------------------------------------------------------------

globals:
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'

# current_page:
#
#   0 = Cooking instructions
#   1 = Ingredients


