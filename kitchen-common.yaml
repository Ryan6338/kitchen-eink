# ===================================================================
# KITCHEN RECIPE DISPLAY
# Shared by the 800x480 Waveshare ESP32-S3 display and PC simulator.
# ===================================================================


# -------------------------------------------------------------------
# DEFAULT SUBSTITUTIONS
# -------------------------------------------------------------------
#
# Hardware configs can override these.
#
# Simulator:
#   display_refresh_delay: 50ms
#
# ESP32-S3 LCD:
#   display_refresh_delay: 50ms
#
# -------------------------------------------------------------------

substitutions:
  display_refresh_delay: 0s


# -------------------------------------------------------------------
# INITIAL DISPLAY REFRESH
# -------------------------------------------------------------------

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_display


# -------------------------------------------------------------------
# FULL-SCREEN BACKGROUND
# -------------------------------------------------------------------

image:
  - file: assets/kitchen-background.png
    id: kitchen_background
    type: RGB565
  - file: assets/day-clock.png
    id: day_clock_background
    type: RGB565
  - file: assets/night-clock.png
    id: night_clock_background
    type: RGB565


# -------------------------------------------------------------------
# FONTS
# -------------------------------------------------------------------
#
# 4 BPP provides smooth anti-aliased text on the RGB LCD.
#
# -------------------------------------------------------------------

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: font_clock
    size: 260
    bpp: 4
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_body
    size: 20
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_body_compact
    size: 16
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_body_small
    size: 13
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_meta
    size: 15
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_time_label
    size: 13
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_time_value
    size: 18
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_heading
    size: 25
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_title
    size: 32
    bpp: 4

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_button
    size: 17
    bpp: 4


# -------------------------------------------------------------------
# LOCAL UI STATE
# -------------------------------------------------------------------

globals:
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'

# current_page:
#
#   0 = Recipe overview
#   1 = Cooking instructions
#   2 = Ingredients


# -------------------------------------------------------------------
# HOME ASSISTANT RECIPE DATA
# -------------------------------------------------------------------
#
# These entities do not have to exist for the simulator to compile.
# Until they exist, the display will show fallback/sample content.
#
# Create these later in Home Assistant:
#
# input_text.kitchen_recipe_title
# input_text.kitchen_recipe_instruction
# input_text.kitchen_recipe_ingredients
# input_text.kitchen_recipe_servings
#
# input_number.kitchen_recipe_step
# input_number.kitchen_recipe_step_count
#
# We'll eventually replace some of these with data from Mealie.
#
# -------------------------------------------------------------------

text_sensor:

  - platform: homeassistant
    id: weather_condition
    entity_id: weather.redcliffe

    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return !id(recipe_active).state;
            then:
              - script.execute: refresh_display

  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun

    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return !id(recipe_active).state;
