# -------------------------------------------------------------------
# DISPLAY REFRESH
# -------------------------------------------------------------------
#
# Everything should use this rather than:
#
#   component.update: main_display
#
# That lets the simulator artificially delay the update while the
# real display can set display_refresh_delay to 0s.
#
# mode: restart is intentional.
#
# If HA sends title, step, instruction, servings etc. one after
# another, the timer restarts and we only render one LCD frame
# once all the new data has arrived.
#
# -------------------------------------------------------------------

script:

  - id: refresh_display
    mode: restart
    then:
      - delay: ${display_refresh_delay}
      - component.update: main_display

  # Home Assistant sends the forecast attributes as a group. Give all of the
  # imported values a moment to settle before drawing a single new frame.
  - id: refresh_weather_display
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            lambda: |-
              return !id(recipe_active).state;
          then:
            - script.execute: refresh_display


  - id: show_ingredients
    then:
      - lambda: |-
          id(current_page) = 2;
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.kitchen_recipe_page
            option: ingredients
      - script.execute: refresh_display


  - id: show_overview
    then:
      - lambda: |-
          id(current_page) = 0;
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.kitchen_recipe_page
            option: overview
      - script.execute: refresh_display


  - id: show_instructions
    then:
      - lambda: |-
          id(current_page) = 1;
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.kitchen_recipe_page
            option: instructions
      - script.execute: refresh_display


# -------------------------------------------------------------------
# TOUCH BUTTONS
# -------------------------------------------------------------------
#
# Screen dimensions:
#
#     800 x 480 (landscape)
#
# Bottom navigation starts at:
#
#     Y = 418
#
# ---------------------------------------------------------------
# |       Previous      |   Ingredients   |        Next         |
# |      0 - 255        |    256 - 543    |     544 - 799       |
# ---------------------------------------------------------------
#
# -------------------------------------------------------------------

binary_sensor:

  - platform: homeassistant
    id: recipe_active
    entity_id: input_boolean.kitchen_recipe_active

    on_press:
      then:
        - lambda: |-
            id(current_page) = 0;
        - script.execute: refresh_display

    on_release:
      then:
        - lambda: |-
            id(current_page) = 0;
        - script.execute: refresh_display

  - platform: touchscreen
    id: touch_previous
    touchscreen_id: main_touchscreen

    x_min: 0
    x_max: 255
    y_min: 418
    y_max: 479

    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(current_page) == 1;
            then:
              - if:
                  condition:
                    lambda: |-
                      return id(recipe_step).has_state() && id(recipe_step).state > 1;
                  then:
                    - homeassistant.action:
                        action: input_number.decrement
                        data:
                          entity_id: input_number.kitchen_recipe_step
                  else:
                    - script.execute: show_overview


  - platform: touchscreen
    id: touch_middle
    touchscreen_id: main_touchscreen

    x_min: 256
    x_max: 543
    y_min: 418
    y_max: 479

    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(current_page) == 0;
            then:
              - script.execute: show_ingredients
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(current_page) == 1;
                  then:
                    - script.execute: show_ingredients
                  else:
                    - script.execute: show_instructions


  - platform: touchscreen
    id: touch_next
    touchscreen_id: main_touchscreen

    x_min: 544
    x_max: 799
    y_min: 418
    y_max: 479

    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(current_page) == 1;
            then:
              - homeassistant.action:
                  action: input_number.increment
                  data:
                    entity_id: input_number.kitchen_recipe_step
