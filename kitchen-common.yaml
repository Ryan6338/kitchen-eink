    id: recipe_page
    entity_id: input_select.kitchen_recipe_page
    on_value:
      then:
        - lambda: |-
            if (x == "overview") {
              id(current_page) = 0;
            } else if (x == "instructions") {
              id(current_page) = 1;
            } else if (x == "ingredients") {
              id(current_page) = 2;
            }
        - script.execute: refresh_display

