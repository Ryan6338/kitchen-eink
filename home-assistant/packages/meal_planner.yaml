# Kitchen meal planner package
#
# Add this file to packages: in Home Assistant.  Mealie remains the source of
# truth: this package stores only the current plan, preferences and a small
# stable-number index for display/search purposes.
#
# Replace the Mealie config entry ID below if yours differs.  Set
# input_text.kitchen_mealie_shopping_list to the entity ID exposed by Mealie.

# Loads the Git-managed Python selection engine in custom_components.
kitchen_meal_planner:

# Register the Git-managed YAML dashboard in Home Assistant's sidebar.
lovelace:
  mode: storage
  dashboards:
    meal-planner:
      mode: yaml
      title: Kitchen Meal Planner
      icon: mdi:calendar-heart
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/meal-planner.yaml

input_number:
  kitchen_meals_this_week:
    name: Meals to generate
    min: 1
    max: 7
    step: 1
    mode: slider
    initial: 4
  kitchen_quick_and_easy_meals_this_week:
    name: Minimum Quick and Easy meals
    min: 0
    max: 7
    step: 1
    mode: slider
    initial: 2
  kitchen_extra_guests:
    name: Extra guests
    min: 0
    max: 20
    step: 1
    mode: box
    initial: 0
  kitchen_servings:
    name: Default servings
    min: 1
    max: 20
    step: 1
    mode: box
    initial: 4
  kitchen_selected_meal_slot:
    name: Selected Meal Slot
    min: 1
    max: 7
    step: 1
    mode: box
    initial: 1

input_boolean:
  kitchen_meal_plan_setup_complete:
    name: Meal plan settings accepted
    icon: mdi:tune-variant
  kitchen_meal_detail_active:
    name: Meal Detail Active
    icon: mdi:food
  kitchen_next_week_selection_active:
    name: Next Week Selection Active
    icon: mdi:calendar-edit
  kitchen_next_week_selection_done:
    name: Next Week Selection Done
    icon: mdi:calendar-check
  kitchen_use_woolworths_specials:
    name: Use Woolworths Specials
    icon: mdi:sale
  kitchen_use_seasonal:
    name: Use Seasonal Ingredients
    icon: mdi:weather-sunny
  kitchen_favour_healthier_recipes:
    name: Favour Healthier Recipes
    icon: mdi:heart-pulse
  kitchen_meal_lock_1:
    name: Monday meal locked
  kitchen_meal_lock_2:
    name: Tuesday meal locked
  kitchen_meal_lock_3:
    name: Wednesday meal locked
  kitchen_meal_lock_4:
    name: Thursday meal locked
  kitchen_meal_lock_5:
    name: Friday meal locked
  kitchen_meal_lock_6:
    name: Saturday meal locked
  kitchen_meal_lock_7:
    name: Sunday meal locked

input_text:
  kitchen_meal_plan:
    name: Kitchen meal plan JSON
    max: 255
    mode: text
  kitchen_next_month_plan:
    name: Kitchen Next Month Meal Plan JSON
    max: 255
    mode: text
    initial: "[]"
  kitchen_meal_history:
    name: Kitchen meal history JSON
    max: 255
    mode: text
  kitchen_include_ingredients:
    name: Include ingredients
    max: 255
    mode: text
    initial: ""
  kitchen_exclude_ingredients:
    name: Exclude ingredients
    max: 255
    mode: text
    initial: ""
  kitchen_weekly_requests:
    name: Weekly meal requests
    max: 255
    mode: text
    initial: ""
  kitchen_pantry:
    name: Pantry ingredients
    max: 255
    mode: text
    initial: "salt, pepper, oil, water"
  kitchen_use_up_ingredients:
    name: Pantry or fridge ingredients to use up
    max: 255
    mode: text
    initial: ""
  kitchen_meal_generator_status:
    name: Meal plan generator status
    max: 255
    mode: text
    initial: "Not run yet"
  kitchen_seasonal_ingredients:
    name: Brisbane seasonal ingredients
    max: 255
    mode: text
    initial: >-
      avocado, banana, mango, pineapple, papaya, tomato, cucumber, zucchini,
      pumpkin, sweet potato, beans, capsicum, eggplant, corn, lettuce, lime,
      lemon, herbs
  kitchen_mealie_shopping_list:
    name: Mealie shopping list entity
    max: 255
    mode: text
    initial: todo.mealie_woolies
  kitchen_woolworths_specials:
    name: Woolworths specials (optional)
    max: 255
    mode: text
    initial: ""
  kitchen_shopping_list:
    name: Kitchen generated shopping list
    max: 255
    mode: text
  kitchen_replacement_query:
    name: Replacement recipe search
    max: 255
    mode: text
  kitchen_household_quick_add:
    name: Household List Quick Add
    max: 255
    mode: text
  kitchen_household_list:
    name: Household List Backup
    max: 255
    mode: text
    initial: ""
  kitchen_meal_1:
    name: Kitchen Selected Meal 1
    max: 255
    mode: text
    initial: Unassigned recipe
  kitchen_meal_2:
    name: Kitchen Selected Meal 2
    max: 255
    mode: text
    initial: Unassigned recipe
  kitchen_meal_3:
    name: Kitchen Selected Meal 3
    max: 255
    mode: text
    initial: Unassigned recipe
  kitchen_meal_4:
    name: Kitchen Selected Meal 4
    max: 255
    mode: text
    initial: Unassigned recipe
  kitchen_meal_1_slug: {name: Kitchen Selected Meal 1 Slug, max: 255, mode: text}
  kitchen_meal_2_slug: {name: Kitchen Selected Meal 2 Slug, max: 255, mode: text}
  kitchen_meal_3_slug: {name: Kitchen Selected Meal 3 Slug, max: 255, mode: text}
  kitchen_meal_4_slug: {name: Kitchen Selected Meal 4 Slug, max: 255, mode: text}
  kitchen_meal_5:
    name: Kitchen Selected Meal 5
    max: 255
    mode: text
    initial: Unassigned recipe
  kitchen_meal_6:
    name: Kitchen Selected Meal 6
    max: 255
    mode: text
    initial: Unassigned recipe
  kitchen_meal_7:
    name: Kitchen Selected Meal 7
    max: 255
    mode: text
    initial: Unassigned recipe
  kitchen_meal_5_slug: {name: Kitchen Selected Meal 5 Slug, max: 255, mode: text}
  kitchen_meal_6_slug: {name: Kitchen Selected Meal 6 Slug, max: 255, mode: text}
  kitchen_meal_7_slug: {name: Kitchen Selected Meal 7 Slug, max: 255, mode: text}

input_select:
  kitchen_display_page:
    name: Kitchen Display Page
    options: [clock, meal_planner]
    initial: clock
  kitchen_meal_day_1:
    name: Monday meal day
    options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Unassigned]
    initial: Unassigned
  kitchen_meal_day_2:
    name: Tuesday meal day
    options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Unassigned]
    initial: Unassigned
  kitchen_meal_day_3:
    name: Wednesday meal day
    options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Unassigned]
    initial: Unassigned
  kitchen_meal_day_4:
    name: Thursday meal day
    options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Unassigned]
    initial: Unassigned
  kitchen_meal_day_5:
    name: Friday meal day
    options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Unassigned]
    initial: Unassigned
  kitchen_meal_day_6:
    name: Saturday meal day
    options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Unassigned]
    initial: Unassigned
  kitchen_meal_day_7:
    name: Sunday meal day
    options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Unassigned]
    initial: Unassigned

template:
  - sensor:
      - name: Kitchen weekly meal plan
        unique_id: kitchen_weekly_meal_plan
        state: >-
          {% set plan = state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) %}
          {{ plan | selectattr('slug', 'defined') | list | count }} meals
        attributes:
          plan: "{{ state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) }}"
          today: >-
            {% set day = now().strftime('%A') %}
            {% set plan = state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) %}
            {{ (plan | selectattr('day', 'equalto', day) | list | first | default({}, true)) }}
      - name: Kitchen meal history
        unique_id: kitchen_meal_history
        state: >-
          {{ states('input_text.kitchen_meal_history') | from_json(default=[]) | count }} cooked meals
        attributes:
          meals: "{{ states('input_text.kitchen_meal_history') | from_json(default=[]) }}"
      - name: Kitchen next month meal plan
        unique_id: kitchen_next_month_meal_plan
        state: >-
          {% set weeks = state_attr('sensor.kitchen_future_meal_plan_generator', 'weeks') | default(states('input_text.kitchen_next_month_plan') | from_json(default=[]), true) %}
          {{ weeks | count }} weeks
        attributes:
          weeks: "{{ state_attr('sensor.kitchen_future_meal_plan_generator', 'weeks') | default(states('input_text.kitchen_next_month_plan') | from_json(default=[]), true) }}"
      - name: Kitchen meal card 1
        unique_id: kitchen_meal_card_1
        state: "{{ states('input_text.kitchen_meal_1') | default('Unassigned', true) }}"
        icon: >-
          {% set m = state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) | selectattr('slot', 'equalto', 1) | list | first | default({}, true) %}
          {{ 'mdi:check-circle' if m.slug | default('') in (states('input_text.kitchen_meal_history') | from_json(default=[]) | map(attribute='slug') | list) else 'mdi:food' }}
      - name: Kitchen meal card 2
        unique_id: kitchen_meal_card_2
        state: "{{ states('input_text.kitchen_meal_2') | default('Unassigned', true) }}"
        icon: >-
          {% set m = state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) | selectattr('slot', 'equalto', 2) | list | first | default({}, true) %}
          {{ 'mdi:check-circle' if m.slug | default('') in (states('input_text.kitchen_meal_history') | from_json(default=[]) | map(attribute='slug') | list) else 'mdi:food' }}
      - name: Kitchen meal card 3
        unique_id: kitchen_meal_card_3
        state: "{{ states('input_text.kitchen_meal_3') | default('Unassigned', true) }}"
        icon: >-
          {% set m = state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) | selectattr('slot', 'equalto', 3) | list | first | default({}, true) %}
          {{ 'mdi:check-circle' if m.slug | default('') in (states('input_text.kitchen_meal_history') | from_json(default=[]) | map(attribute='slug') | list) else 'mdi:food' }}
      - name: Kitchen meal card 4
        unique_id: kitchen_meal_card_4
        state: "{{ states('input_text.kitchen_meal_4') | default('Unassigned', true) }}"
        icon: >-
          {% set m = state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) | selectattr('slot', 'equalto', 4) | list | first | default({}, true) %}
          {{ 'mdi:check-circle' if m.slug | default('') in (states('input_text.kitchen_meal_history') | from_json(default=[]) | map(attribute='slug') | list) else 'mdi:food' }}
      - name: Kitchen next week selection due
        unique_id: kitchen_next_week_selection_due
        state: "{{ 'on' if now().weekday() == 4 and is_state('input_boolean.kitchen_next_week_selection_done', 'off') else 'off' }}"
        device_class: problem

script:
  kitchen_test_meal_slot_labels:
    alias: Kitchen - Test Meal Slot Labels
    description: Writes fixed test names to the meal helpers to verify display assignment.
    mode: single
    sequence:
      - repeat:
          for_each: "{{ range(1, 5) | list }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "{{ 'input_text.kitchen_meal_' ~ repeat.item }}"
              data:
                value: "TEST RECIPE SLOT {{ repeat.item }}"
            - action: input_text.set_value
              target:
                entity_id: "{{ 'input_text.kitchen_meal_' ~ repeat.item ~ '_slug' }}"
              data:
                value: "test-recipe-slot-{{ repeat.item }}"
      - action: persistent_notification.create
        data:
          title: Meal slot label test
          message: Test names were written to meal slots 1-4.

  kitchen_show_meal_planner:
    alias: Kitchen - Show Meal Planner On Display
    mode: restart
    sequence:
      - action: input_select.select_option
        target: {entity_id: input_select.kitchen_display_page}
        data: {option: meal_planner}

  kitchen_accept_meal_plan_settings:
    alias: Kitchen - Accept Meal Plan Settings
    description: Lock in the sliders and open an empty set of meal slots.
    mode: single
    sequence:
      - if:
          - condition: template
            value_template: >-
              {{ states('input_number.kitchen_quick_and_easy_meals_this_week') | int(2)
                 > states('input_number.kitchen_meals_this_week') | int(4) }}
        then:
          - action: persistent_notification.create
            data:
              title: Invalid meal plan settings
              message: The Quick and Easy minimum cannot exceed the number of meals.
          - stop: The Quick and Easy minimum cannot exceed the number of meals.
      - action: kitchen_meal_planner.load_catalog
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
      - repeat:
          for_each: "{{ range(1, 8) | list }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "{{ 'input_text.kitchen_meal_' ~ repeat.item }}"
              data:
                value: ""
            - action: input_text.set_value
              target:
                entity_id: "{{ 'input_text.kitchen_meal_' ~ repeat.item ~ '_slug' }}"
              data:
                value: ""
            - action: input_boolean.turn_off
              target:
                entity_id: "{{ 'input_boolean.kitchen_meal_lock_' ~ repeat.item }}"
      - action: kitchen_meal_planner.sync_plan
      - action: input_text.set_value
        target: {entity_id: input_text.kitchen_meal_generator_status}
        data: {value: "Ready to randomize"}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.kitchen_meal_plan_setup_complete}

  kitchen_reset_meal_plan:
    alias: Kitchen - Reset Meal Plan
    description: Clear all meal slots and return to the setup sliders.
    mode: single
    sequence:
      - repeat:
          for_each: "{{ range(1, 8) | list }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "{{ 'input_text.kitchen_meal_' ~ repeat.item }}"
              data:
                value: ""
            - action: input_text.set_value
              target:
                entity_id: "{{ 'input_text.kitchen_meal_' ~ repeat.item ~ '_slug' }}"
              data:
                value: ""
            - action: input_boolean.turn_off
              target:
                entity_id: "{{ 'input_boolean.kitchen_meal_lock_' ~ repeat.item }}"
      - action: kitchen_meal_planner.sync_plan
      - action: input_text.set_value
        target: {entity_id: input_text.kitchen_meal_generator_status}
        data: {value: "Not run yet"}
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.kitchen_meal_plan_setup_complete}

  kitchen_generate_four_meals_from_mealie:
    alias: Kitchen - Generate Configured Balanced Meal Plan
    description: Generate the configured number of balanced meals with the Python planner.
    mode: single
    sequence:
      - action: kitchen_meal_planner.generate_plan
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          meal_count: "{{ states('input_number.kitchen_meals_this_week') | int(4) }}"
          minimum_quick_and_easy: "{{ states('input_number.kitchen_quick_and_easy_meals_this_week') | int(2) }}"
        response_variable: plan_result
      - if:
          - condition: template
            value_template: "{{ not plan_result.success | default(false) }}"
        then:
          - stop: "{{ plan_result.error | default('Meal plan generation failed') }}"
      - action: input_select.select_option
        target: {entity_id: input_select.kitchen_display_page}
        data: {option: meal_planner}
      - action: persistent_notification.create
        data:
          title: Balanced meal plan generated
          message: "{{ plan_result.meals | map(attribute='name') | join(', ') }}"

  kitchen_generate_meal_slot_from_mealie:
    alias: Kitchen - Generate Balanced Meal For Card
    description: Replace one card while preserving all Python planner constraints.
    mode: queued
    fields:
      slot:
        required: true
        selector:
          number:
            min: 1
            max: 4
            step: 1
    sequence:
      - action: kitchen_meal_planner.replace_meal
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          slot: "{{ slot | int(1) }}"
          minimum_quick_and_easy: "{{ states('input_number.kitchen_quick_and_easy_meals_this_week') | int(2) }}"
        response_variable: replacement_result
      - if:
          - condition: template
            value_template: "{{ not replacement_result.success | default(false) }}"
        then:
          - stop: "{{ replacement_result.error | default('Meal replacement failed') }}"
  kitchen_add_meal_slot:
    alias: Kitchen - Add Meal Slot
    description: Activates one additional optional meal slot, up to seven.
    mode: single
    sequence:
      - action: input_number.increment
        target:
          entity_id: input_number.kitchen_meals_this_week
      - action: persistent_notification.create
        data:
          title: Meal slot added
          message: >-
            The planner now has {{ states('input_number.kitchen_meals_this_week') | int(4) + 1 }} active meal slots.

  kitchen_lock_meal:
    alias: Kitchen - Toggle meal slot lock
    mode: parallel
    fields:
      slot:
        required: true
        selector:
          number: {min: 1, max: 7, mode: box}
    sequence:
      - if:
          - condition: template
            value_template: "{{ is_state('input_boolean.kitchen_meal_lock_' ~ (slot | int), 'on') }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ 'input_boolean.kitchen_meal_lock_' ~ slot | int }}"
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ 'input_boolean.kitchen_meal_lock_' ~ slot | int }}"

  kitchen_unlock_meal:
    alias: Kitchen - Unlock meal slot
    mode: parallel
    fields:
      slot:
        required: true
        selector:
          number: {min: 1, max: 7, mode: box}
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ 'input_boolean.kitchen_meal_lock_' ~ slot | int }}"


  kitchen_search_replacement:
    alias: Kitchen - Search Mealie replacement
    mode: single
    fields:
      query:
        required: true
        selector: {text: null}
    sequence:
      - action: mealie.get_recipes
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          search_terms: "{{ query }}"
          result_limit: 10
        response_variable: search_result
      - stop: Mealie replacement candidates
        response_variable: "{{ search_result }}"

  kitchen_mark_meal_cooked:
    alias: Kitchen - Mark meal as cooked
    description: Records a durable Home Assistant event for the meal history calendar.
    mode: single
    fields:
      slot:
        required: true
        selector:
          number: {min: 1, max: 7, mode: box}
    sequence:
      - variables:
          plan: "{{ state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) }}"
          meal: "{{ plan | selectattr('slot', 'equalto', slot | int) | list | first | default({}, true) }}"
      - action: mealie.get_recipe
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          recipe_id: "{{ meal.slug | default('') }}"
        response_variable: recipe_result
      - variables:
          mealie_recipe_id: >-
            {{ recipe_result.recipe.id
               | default(recipe_result.recipe.recipe_id, true)
               | default(meal.slug, true) }}
      - if:
          - condition: template
            value_template: "{{ mealie_recipe_id not in ['', 'unknown', 'None', 'none'] }}"
        then:
          - action: rest_command.mealie_recipe_timeline_cooked
            data:
              payload: >-
                {{ {
                  'recipe_id': mealie_recipe_id,
                  'subject': 'Recipe cooked',
                  'event_type': 'info',
                  'eventMessage': 'Marked cooked from Home Assistant kitchen meal planner.',
                  'timestamp': now().isoformat()
                } | to_json }}
      - event: kitchen_meal_cooked
        event_data:
          slot: "{{ slot | int }}"
          slug: "{{ meal.slug | default('') }}"
          recipe_name: "{{ meal.name | default('') }}"
          recipe_number: "{{ meal.number | default(0) }}"
          cooked_day: "{{ now().strftime('%A') }}"
          cooked_at: "{{ now().isoformat() }}"
      - variables:
          history: "{{ states('input_text.kitchen_meal_history') | from_json(default=[]) }}"
          new_history: "{{ (history + [{'date': now().date().isoformat(), 'cooked_day': now().strftime('%A'), 'slot': slot | int, 'planned_day': meal.day | default('Unassigned'), 'slug': meal.slug, 'name': meal.name, 'number': meal.number | default(0)}])[-30:] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.kitchen_meal_history
        data:
          value: "{{ new_history | to_json }}"

  kitchen_generate_shopping_list:
    alias: Kitchen - Generate shopping list
    description: Adds final-plan ingredients to Mealie in parallel with one refresh.
    mode: single
    sequence:
      - variables:
          shopping_list_entity: >-
            {% set configured = states('input_text.kitchen_mealie_shopping_list') %}
            {% if configured not in ['', 'unknown', 'unavailable']
                  and states(configured) not in ['unknown', 'unavailable'] %}
              {{ configured }}
            {% elif states('todo.mealie_woolies') not in ['unknown', 'unavailable'] %}
              todo.mealie_woolies
            {% else %}
              {{ configured }}
            {% endif %}
      - if:
          - condition: template
            value_template: >-
              {{ shopping_list_entity != states('input_text.kitchen_mealie_shopping_list') }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.kitchen_mealie_shopping_list
            data:
              value: "{{ shopping_list_entity }}"
      - action: kitchen_meal_planner.populate_shopping_list
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          shopping_list_entity: "{{ shopping_list_entity }}"
        response_variable: shopping_result
      - action: input_text.set_value
        target:
          entity_id: input_text.kitchen_shopping_list
        data:
          value: "{{ shopping_result.message }}"

  kitchen_clear_shopping_list:
    alias: Kitchen - Clear shopping list
    description: Removes every item from the configured Mealie grocery list.
    mode: single
    sequence:
      - variables:
          shopping_list_entity: >-
            {% set configured = states('input_text.kitchen_mealie_shopping_list') %}
            {% if configured not in ['', 'unknown', 'unavailable']
                  and states(configured) not in ['unknown', 'unavailable'] %}
              {{ configured }}
            {% elif states('todo.mealie_woolies') not in ['unknown', 'unavailable'] %}
              todo.mealie_woolies
            {% else %}
              {{ configured }}
            {% endif %}
      - action: kitchen_meal_planner.clear_shopping_list
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          shopping_list_entity: "{{ shopping_list_entity }}"
        response_variable: clear_result
      - action: input_text.set_value
        target:
          entity_id: input_text.kitchen_shopping_list
        data:
          value: "{{ clear_result.message }}"

  kitchen_suggest_healthier_alternative:
    alias: Kitchen - Suggest healthier alternative
    description: Returns a suggestion only; it never changes a recipe without approval.
    mode: single
    fields:
      recipe_name:
        required: true
        selector: {text: null}
    sequence:
      - stop: Healthier alternative requires approval
        response_variable:
          recipe: "{{ recipe_name }}"
          suggestions:
            - use extra vegetables or legumes for part of the meat
            - use less added salt and choose herbs, citrus or spices
            - replace deep-frying with baking, grilling or air-frying
            - use wholegrain or higher-fibre alternatives where suitable
          apply_changes: false

  kitchen_generate_next_month_plan:
    alias: Kitchen - Generate Four Week Future Plan
    description: Generate four future weeks with the Python planner.
    mode: single
    sequence:
      - action: kitchen_meal_planner.generate_future_plan
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          weeks: 4
          meal_count: "{{ states('input_number.kitchen_meals_this_week') | int(4) }}"
          minimum_quick_and_easy: "{{ states('input_number.kitchen_quick_and_easy_meals_this_week') | int(2) }}"
        response_variable: future_plan_result
      - if:
          - condition: template
            value_template: "{{ not future_plan_result.success | default(false) }}"
        then:
          - stop: "{{ future_plan_result.error | default('Future meal-plan generation failed') }}"
      - action: persistent_notification.create
        data:
          title: Four-week meal plan updated
          message: Four future weeks were generated with Python planner constraints.
  kitchen_find_meals_using_ingredient:
    alias: Kitchen - Find Planned Recipes Using Ingredient
    description: Returns a spoken answer showing planned recipes containing an ingredient and whether they were cooked.
    mode: single
    fields:
      ingredient:
        name: Ingredient
        description: Ingredient mentioned by the user, for example spinach.
        required: true
        selector:
          text: null
    sequence:
      - variables:
          query: "{{ ingredient | lower | trim }}"
          plan: "{{ state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) }}"
          history: "{{ states('input_text.kitchen_meal_history') | from_json(default=[]) }}"
          cooked_slugs: "{{ history | map(attribute='slug') | list }}"
      - variables:
          matches: []
      - repeat:
          for_each: "{{ plan | selectattr('slug', 'defined') | list }}"
          sequence:
            - action: mealie.get_recipe
              data:
                config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                recipe_id: "{{ repeat.item.slug }}"
              response_variable: recipe_result
            - variables:
                ingredient_text: >-
                  {{ recipe_result.recipe.ingredients | default([])
                     | map(attribute='display') | join(' ') | lower }}
            - if:
                - condition: template
                  value_template: "{{ query in ingredient_text }}"
              then:
                - variables:
                    matches: >-
                      {{ matches + [{'name': repeat.item.name | default('Unnamed recipe'),
                      'slug': repeat.item.slug,
                      'day': repeat.item.day | default('Unassigned'),
                      'cooked': repeat.item.slug in cooked_slugs}] }}
      - variables:
          not_cooked: "{{ matches | rejectattr('cooked', 'equalto', true) | map(attribute='name') | list }}"
          cooked: "{{ matches | selectattr('cooked', 'equalto', true) | map(attribute='name') | list }}"
          speech: >-
            {% if not matches %}
              I couldn't find {{ query }} in any recipe in this week's meal plan.
            {% else %}
              {{ query | title }} is used in {{ matches | map(attribute='name') | list | join(', ') }}.
              {% if not_cooked %}Not yet cooked: {{ not_cooked | join(', ') }}.{% endif %}
              {% if cooked %}Already cooked: {{ cooked | join(', ') }}.{% endif %}
            {% endif %}
      - stop: Ingredient search complete
        response_variable:
          speech: "{{ speech }}"
          ingredient: "{{ query }}"
          matches: "{{ matches }}"

  kitchen_open_meal:
    alias: Kitchen - Open Meal From Card
    mode: parallel
    fields:
      slot:
        required: true
        selector: {number: {min: 1, max: 7, mode: box}}
    sequence:
      - action: input_number.set_value
        target: {entity_id: input_number.kitchen_selected_meal_slot}
        data: {value: "{{ slot }}"}
      - variables:
          plan: "{{ state_attr('sensor.kitchen_meal_plan_generator', 'plan') | default(states('input_text.kitchen_meal_plan') | from_json(default=[]), true) }}"
          meal: "{{ plan | selectattr('slot', 'equalto', slot | int) | list | first | default({}, true) }}"
      - if:
          - condition: template
            value_template: "{{ meal.slug | default('') != '' }}"
        then:
          - action: script.set_kitchen_recipe
            data:
              recipe_slug: "{{ meal.slug }}"
              recipe_name: "{{ meal.name }}"
          - action: input_boolean.turn_on
            target: {entity_id: input_boolean.kitchen_meal_detail_active}

  kitchen_back_to_menu:
    alias: Kitchen - Back To Meal Menu
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.kitchen_meal_detail_active}
      - action: script.clear_kitchen_recipe

  kitchen_cook_selected_meal:
    alias: Kitchen - Cook Selected Meal
    mode: single
    sequence:
      - action: script.kitchen_mark_meal_cooked
        data:
          slot: "{{ states('input_number.kitchen_selected_meal_slot') | int(1) }}"
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.kitchen_meal_detail_active}
      - action: script.clear_kitchen_recipe

  kitchen_start_next_week_selection:
    alias: Kitchen - Start Next Week Selection
    mode: single
    sequence:
      - action: script.kitchen_generate_four_meals_from_mealie
      - repeat:
          for_each: "{{ range(1, states('input_number.kitchen_meals_this_week') | int(4) + 1) | list }}"
          sequence:
            - action: input_boolean.turn_off
              target: {entity_id: "{{ 'input_boolean.kitchen_meal_lock_' ~ repeat.item }}"}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.kitchen_next_week_selection_active}
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.kitchen_next_week_selection_done}

  kitchen_add_selection_recipe:
    alias: Kitchen - Add Recipe To Next Week Selection
    description: Add one Python-selected recipe to the next available slot.
    mode: single
    sequence:
      - variables:
          next_slot: "{{ states('input_number.kitchen_meals_this_week') | int(4) + 1 }}"
      - if:
          - condition: template
            value_template: "{{ next_slot <= 7 and is_state('input_boolean.kitchen_next_week_selection_active', 'on') }}"
        then:
          - action: kitchen_meal_planner.replace_meal
            data:
              config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
              slot: "{{ next_slot }}"
              minimum_quick_and_easy: "{{ states('input_number.kitchen_quick_and_easy_meals_this_week') | int(2) }}"
            response_variable: added_meal_result
          - if:
              - condition: template
                value_template: "{{ added_meal_result.success | default(false) }}"
            then:
              - action: input_number.increment
                target: {entity_id: input_number.kitchen_meals_this_week}
            else:
              - stop: "{{ added_meal_result.error | default('Could not add a meal') }}"
        else:
          - action: persistent_notification.create
            data:
              title: Meal slots full
              message: You already have seven active meal slots.
  kitchen_finish_next_week_selection:
    alias: Kitchen - Lock Plan And Create Grocery List
    mode: single
    sequence:
      - variables:
          active_count: "{{ states('input_number.kitchen_meals_this_week') | int(4) }}"
          empty_slots: >-
            {% set ns = namespace(items=[]) %}
            {% for slot in range(1, active_count | int + 1) %}
              {% if states('input_text.kitchen_meal_' ~ slot) in ['', 'unknown', 'unavailable'] %}
                {% set ns.items = ns.items + [slot] %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
      - if:
          - condition: template
            value_template: "{{ empty_slots | count > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Meal plan is incomplete
              message: Randomize the empty meal slots before creating the grocery list.
          - stop: The meal plan still has empty slots.
      - repeat:
          for_each: "{{ range(1, active_count | int + 1) | list }}"
          sequence:
            - action: input_boolean.turn_on
              target: {entity_id: "{{ 'input_boolean.kitchen_meal_lock_' ~ repeat.item }}"}
      - action: kitchen_meal_planner.sync_plan
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.kitchen_next_week_selection_active}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.kitchen_next_week_selection_done}
      - action: script.kitchen_generate_shopping_list
      - action: notify.notify
        data:
          title: Meal plan locked
          message: >-
            Your meals are locked in. {{ states('input_text.kitchen_shopping_list') }}.

  kitchen_add_household_item:
    alias: Kitchen - Add Household List Item
    mode: queued
    fields:
      item:
        required: true
        selector: {text: null}
    sequence:
      - variables:
          old_items: "{{ states('input_text.kitchen_household_list') }}"
          new_items: "{{ (old_items.split('\\n') + [item | trim]) | reject('equalto', '') | unique | join('\\n') }}"
      - action: input_text.set_value
        target: {entity_id: input_text.kitchen_household_list}
        data: {value: "{{ new_items }}"}
      - action: todo.add_item
        continue_on_error: true
        target: {entity_id: todo.kitchen_household_list}
        data: {item: "{{ item | trim }}"}

automation:
  - id: kitchen_next_week_selection_friday
    alias: Kitchen - Friday Select Next Week Meals
    description: Shows the Friday planning task and sends a mobile notification.
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: time
        weekday: [fri]
      - condition: state
        entity_id: input_boolean.kitchen_next_week_selection_done
        state: "off"
    action:
      - action: notify.notify
        data:
          title: Select next week's meals
          message: >-
            Select and lock next week's
            {{ states('input_number.kitchen_meals_this_week') | int(4) }} meals
            from the kitchen meal planner.
          data:
            url: /meal-planner/kitchen-meal-planner

  - id: kitchen_reset_next_week_selection_thursday
    alias: Kitchen - Reset Weekly Meal Selection
    trigger:
      - platform: time
        at: "06:20:00"
    condition:
      - condition: time
        weekday: [thu]
    action:
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.kitchen_next_week_selection_done}
  - id: kitchen_create_next_month_plan_on_start
    alias: Kitchen - Create Next Month Plan on Startup
    description: Creates the initial four-week future plan once after Home Assistant starts.
    trigger:
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >-
          {{ states('input_text.kitchen_next_month_plan') in ['', '[]', 'unknown', 'unavailable'] }}
    action:
      - delay: "00:00:30"
      - action: script.kitchen_generate_next_month_plan

  - id: kitchen_refresh_future_plan_thursday
    alias: Kitchen - Refresh Future Plan Thursday
    description: Refreshes the next four future weeks after the Woolworths specials update.
    trigger:
      - platform: time
        at: "06:15:00"
    condition:
      - condition: time
        weekday: [thu]
    action:
      - action: script.kitchen_generate_next_month_plan

  - id: kitchen_sync_woolworths_special_terms
    alias: Kitchen - Sync Woolworths Special Ingredients
    description: Mirrors the Woolworths specials sensor into the planner helper for visibility and fallback use.
    trigger:
      - platform: state
        entity_id: sensor.woolworths_specials
    condition:
      - condition: template
        value_template: "{{ state_attr('sensor.woolworths_specials', 'ingredient_terms') is not none }}"
    action:
      - action: input_text.set_value
        target:
          entity_id: input_text.kitchen_woolworths_specials
        data:
          value: "{{ state_attr('sensor.woolworths_specials', 'ingredient_terms') | join(', ') }}"


intent_script:

  GenerateKitchenMealPlan:
    description: Generate the configured number of balanced, unique dinner recipes from Mealie.
    action:
      - action: script.kitchen_generate_four_meals_from_mealie
    speech:
      text: >-
        I generated {{ states('input_number.kitchen_meals_this_week') | int(4) }}
        balanced meals from Mealie.

  OpenKitchenMealPlanner:
    description: Open the meal planner on the kitchen display.
    action:
      action: script.turn_on
      target:
        entity_id: script.kitchen_show_meal_planner
    speech:
      text: "Opening this week's meal plan."
  CloseKitchenMealPlanner:
    description: Return the kitchen display to the clock.
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.kitchen_display_page
        data:
          option: clock
    speech:
      text: "Closing the meal planner."
  KitchenIngredientMeals:
    description: Find this week's planned recipes that use a spoken ingredient.
    action:
      - action: script.kitchen_find_meals_using_ingredient
        data:
          ingredient: "{{ ingredient }}"
        response_variable: meal_response
    speech:
      text: "{{ meal_response.speech }}"
  SearchKitchenRecipe:
    description: Search Mealie from the Home Assistant mobile Assist app.
    action:
      - action: mealie.get_recipes
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          search_terms: "{{ query }}"
          result_limit: 5
        response_variable: search_result
    speech:
      text: >-
        {% set recipes = search_result.recipes | default(search_result, true) %}
        {% if recipes | count == 0 %}
          I couldn't find any Mealie recipes matching {{ query }}.
        {% else %}
          I found {{ recipes | map(attribute='name') | join(', ') }}.
        {% endif %}
  AddKitchenRecipeToMealPlan:
    description: Add the first matching Mealie recipe to the next unlocked meal slot.
    action:
      - action: mealie.get_recipes
        data:
          config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
          search_terms: "{{ query }}"
          result_limit: 10
        response_variable: search_result
      - variables:
          recipes: "{{ search_result.recipes | default(search_result, true) }}"
          active_slots: "{{ states('input_number.kitchen_meals_this_week') | int(4) }}"
          unlocked_slot: >-
            {% set ns = namespace(slot=0) %}
            {% for n in range(1, active_slots + 1) %}
              {% if ns.slot == 0 and is_state('input_boolean.kitchen_meal_lock_' ~ n, 'off') %}
                {% set ns.slot = n %}
              {% endif %}
            {% endfor %}
            {{ ns.slot }}
          chosen: "{{ recipes | first | default({}, true) }}"
      - if:
          - condition: template
            value_template: "{{ recipes | count == 0 }}"
        then:
          - stop: No matching Mealie recipe
      - if:
          - condition: template
            value_template: "{{ unlocked_slot | int(0) == 0 }}"
        then:
          - stop: No unlocked meal slot
      - action: input_text.set_value
        target:
          entity_id: "{{ 'input_text.kitchen_meal_' ~ unlocked_slot }}"
        data:
          value: "{{ chosen.name | default('Unassigned recipe') }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ 'input_text.kitchen_meal_' ~ unlocked_slot ~ '_slug' }}"
        data:
          value: "{{ chosen.slug | default(chosen.id, true) | default(chosen.recipe_id, true) }}"
      - action: kitchen_meal_planner.sync_plan
    speech:
      text: >-
        {% set recipes = search_result.recipes | default(search_result, true) %}
        {% if recipes | count == 0 %}
          I couldn't find a recipe matching {{ query }}.
        {% elif unlocked_slot | int(0) == 0 %}
          There are no unlocked meal slots available.
        {% else %}
          Added {{ chosen.name }} to meal slot {{ unlocked_slot }}.
        {% endif %}
  AddHouseholdItem:
    description: Add a household item to the secondary list.
    action:
      - action: script.kitchen_add_household_item
        data:
          item: "{{ item }}"
    speech:
      text: "Added {{ item }} to the household list."
