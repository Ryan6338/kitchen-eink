title: Kitchen Meal Planner
views:
  - title: Meal Planner
    path: kitchen-meal-planner
    icon: mdi:calendar-heart
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: This week's meals
            icon: mdi:calendar-week
          - type: conditional
            conditions:
              - entity: input_boolean.kitchen_meal_plan_setup_complete
                state: "off"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    ## Set up this week's plan

                    Choose how many meals to plan and how many must be categorized
                    **Quick and Easy**, then press **Accept**.
                - type: entities
                  title: Generator preferences
                  show_header_toggle: false
                  entities:
                    - entity: input_number.kitchen_meals_this_week
                      name: Number of meals
                    - entity: input_number.kitchen_quick_and_easy_meals_this_week
                      name: Minimum Quick and Easy meals
                    - entity: input_text.kitchen_use_up_ingredients
                      name: Ingredients to use up
                    - entity: input_text.kitchen_seasonal_ingredients
                      name: Seasonal ingredients
                    - entity: input_boolean.kitchen_use_woolworths_specials
                      name: Favour ingredients on special
                - type: markdown
                  content: |
                    {% set meals = states('input_number.kitchen_meals_this_week') | int(4) %}
                    {% set easy = states('input_number.kitchen_quick_and_easy_meals_this_week') | int(2) %}
                    {% if easy > meals %}
                    ⚠️ Quick and Easy meals cannot exceed the total meal count.
                    {% else %}
                    Ready for **{{ meals }} meals**, including at least **{{ easy }} Quick and Easy**.
                    {% endif %}
                - type: button
                  name: Accept
                  icon: mdi:check
                  tap_action:
                    action: call-service
                    service: script.kitchen_accept_meal_plan_settings
          - type: conditional
            conditions:
              - entity: input_boolean.kitchen_meal_plan_setup_complete
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    ## Meal selection

                    **{{ states('input_number.kitchen_meals_this_week') | int(4) }} meals** · minimum
                    **{{ states('input_number.kitchen_quick_and_easy_meals_this_week') | int(2) }} Quick and Easy**.
                    Lock any meal you want to keep, then press **Randomize** to
                    regenerate only the unlocked slots.
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:kitchen-meal-action-card
                      name: Randomize unlocked meals
                      icon: mdi:dice-multiple
                      busy_name: Randomizing meals…
                      entity: script.kitchen_generate_four_meals_from_mealie
                    - type: button
                      name: Reset
                      icon: mdi:restart
                      tap_action:
                        action: call-service
                        service: script.kitchen_reset_meal_plan
                - type: markdown
                  title: Generator status
                  content: |
                    {% set result = states('input_text.kitchen_meal_generator_status') %}
                    {% if result.startswith('PASS') %}
                    ✅ {{ result }}
                    {% elif result.startswith('FAIL') %}
                    ❌ {{ result }}
                    {% elif result.startswith('Running') %}
                    ⏳ {{ result }}
                    {% else %}
                    {{ result }}
                    {% endif %}

                    {% set diagnostics = state_attr('sensor.kitchen_meal_plan_generator', 'diagnostics') | default({}, true) %}
                    {% if diagnostics %}
                    {{ diagnostics.eligible_recipes | default('--') }} eligible ·
                    {{ diagnostics.quick_and_easy_recipes | default('--') }} Quick and Easy ·
                    {{ diagnostics.locked_meals | default(0) }} locked preserved ·
                    {{ diagnostics.avoided_previous | default(0) }} previous meals rotated out ·
                    {{ diagnostics.excluded_complex | default(0) }} complex excluded ·
                    {{ diagnostics.excluded_recent | default(0) }} recent excluded
                    {% endif %}
                - type: custom:kitchen-meal-picker-card
                  slot: 1
                  config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                - type: conditional
                  conditions:
                    - entity: input_number.kitchen_meals_this_week
                      condition: numeric_state
                      above: 1
                  card:
                    type: custom:kitchen-meal-picker-card
                    slot: 2
                    config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                - type: conditional
                  conditions:
                    - entity: input_number.kitchen_meals_this_week
                      condition: numeric_state
                      above: 2
                  card:
                    type: custom:kitchen-meal-picker-card
                    slot: 3
                    config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                - type: conditional
                  conditions:
                    - entity: input_number.kitchen_meals_this_week
                      condition: numeric_state
                      above: 3
                  card:
                    type: custom:kitchen-meal-picker-card
                    slot: 4
                    config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                - type: conditional
                  conditions:
                    - entity: input_number.kitchen_meals_this_week
                      condition: numeric_state
                      above: 4
                  card:
                    type: custom:kitchen-meal-picker-card
                    slot: 5
                    config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                - type: conditional
                  conditions:
                    - entity: input_number.kitchen_meals_this_week
                      condition: numeric_state
                      above: 5
                  card:
                    type: custom:kitchen-meal-picker-card
                    slot: 6
                    config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                - type: conditional
                  conditions:
                    - entity: input_number.kitchen_meals_this_week
                      condition: numeric_state
                      above: 6
                  card:
                    type: custom:kitchen-meal-picker-card
                    slot: 7
                    config_entry_id: 01M3JW7B0TPXD7C9CWMBARJ8KX
                - type: custom:kitchen-meal-action-card
                  name: Lock all and create grocery list
                  icon: mdi:cart-check
                  busy_name: Creating grocery list…
                  entity: script.kitchen_finish_next_week_selection
      - type: grid
        cards:
          - type: conditional
            conditions:
              - entity: input_boolean.kitchen_meal_detail_active
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    # {{ states('sensor.kitchen_recipe_display') }}

                    **Servings:** {{ state_attr('sensor.kitchen_recipe_display', 'servings') | default('--') }}  
                    **Time:** {{ state_attr('sensor.kitchen_recipe_display', 'total_time') | default('--') }}

                    ## Ingredients
                    {% set ingredients = state_attr('sensor.kitchen_recipe_display', 'ingredients') | default('', true) %}
                    {{ ingredients | replace('\n', '  \n') if ingredients is string else ingredients | join('  \n') }}

                    ## Current step
                    {{ state_attr('sensor.kitchen_recipe_display', 'instruction') | default('Open the recipe display for cooking steps.') }}
                - type: grid
                  columns: 2
                  cards:
                    - type: button
                      name: Cooked
                      icon: mdi:check-circle
                      tap_action:
                        action: call-service
                        service: script.kitchen_cook_selected_meal
                    - type: button
                      name: Back to menu
                      icon: mdi:arrow-left
                      tap_action:
                        action: call-service
                        service: script.kitchen_back_to_menu
          - type: conditional
            conditions:
              - entity: input_boolean.kitchen_meal_detail_active
                state: "off"
            card:
              type: markdown
              content: |
                Use **Open** on a saved Mealie meal to view its recipe. Custom meals do not have recipe details.
          - type: heading
            heading: Shopping lists
            icon: mdi:cart
          - type: markdown
            content: >-
              **Last grocery-list result:**
              {{ states('input_text.kitchen_shopping_list') | default('Not generated yet', true) }}
          - type: custom:kitchen-meal-action-card
            name: Clear grocery list
            icon: mdi:delete-sweep
            busy_name: Clearing grocery list…
            entity: script.kitchen_clear_shopping_list
            confirmation: Clear every item from the Mealie grocery list?
          - type: todo-list
            entity: todo.mealie_woolies
            title: Meal groceries
          - type: todo-list
            entity: todo.kitchen_household_list
            title: Household list
