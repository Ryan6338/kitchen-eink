alias: Previous Kitchen Recipe Step
description: Move the kitchen display to the previous recipe instruction.
sequence:
  - variables:
      current_step: "{{ states('input_number.kitchen_recipe_step') | int(1) }}"
      target_step: "{{ [current_step - 1, 1] | max }}"

  - action: input_select.select_option
    target:
      entity_id: input_select.kitchen_recipe_page
    data:
      option: instructions

  - action: input_number.set_value
    target:
      entity_id: input_number.kitchen_recipe_step
    data:
      value: "{{ target_step }}"

  - variables:
      result:
        success: true
        step: "{{ target_step }}"

  - stop: Kitchen recipe moved back
    response_variable: result
