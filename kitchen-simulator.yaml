substitutions:
  display_refresh_delay: 50ms

esphome:
  name: kitchen-display-simulator
  friendly_name: Kitchen Display Simulator

host:
  mac_address: "02:4B:49:54:43:48"

logger:

api:

<<: !include kitchen-common.yaml


# ---------------------------------------------------------------
# DISPLAY
# ---------------------------------------------------------------

display:
  - platform: sdl
    id: main_display

    dimensions:
      width: 1024
      height: 600

    update_interval: never

    auto_clear_enabled: false


# ---------------------------------------------------------------
# TOUCHSCREEN
# ---------------------------------------------------------------

touchscreen:
  - platform: sdl
    id: main_touchscreen
    display: main_display
